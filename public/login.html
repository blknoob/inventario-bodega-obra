<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ingreso bodega | Inventario</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="login-shell">
    <div class="login-box">
      <h1>Ingreso de bodega</h1>
      <p class="sub">Solo el personal de bodega necesita iniciar sesión para cargar movimientos.</p>

      <div id="error" class="alert alert-error hidden"></div>

      <form id="form-login">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required autocomplete="username" />
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" required autocomplete="current-password" />
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="btn-entrar">Entrar</button>
      </form>

      <a class="back" href="index.html">← Volver al inventario</a>
    </div>
  </div>

  <script type="module">
    import { iniciarSesion, observarSesion } from "./js/auth.js";

    const params = new URLSearchParams(location.search);
    const volver = params.get("volver") || "bodega.html";

    // Si ya hay sesión activa, no tiene sentido mostrar el login.
    observarSesion((user) => {
      if (user) location.replace(volver);
    });

    const form = document.getElementById("form-login");
    const errorBox = document.getElementById("error");
    const btn = document.getElementById("btn-entrar");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorBox.classList.add("hidden");
      btn.disabled = true;
      btn.textContent = "Entrando…";
      try {
        await iniciarSesion(form.email.value, form.password.value);
        location.replace(volver);
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.classList.remove("hidden");
        btn.disabled = false;
        btn.textContent = "Entrar";
      }
    });
  </script>
</body>
</html>
