<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ingreso | Inventario</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="login-shell">
    <div class="login-box">
      <h1>Ingreso</h1>
      <p class="sub">Bodega, capataz, supervisor y prevencionista. Para solo consultar el inventario no hace falta cuenta.</p>

      <div id="error" class="alert alert-error hidden"></div>

      <form id="form-login">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required autocomplete="username" />
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <div style="position:relative;">
            <input type="password" id="password" name="password" required autocomplete="current-password" class="campo-password" />
            <button type="button" id="btn-ver-password" class="btn-ver-password" aria-label="Mostrar contraseña">
              <svg viewBox="0 0 20 20" fill="currentColor" width="20" height="20"><path d="M10 12a2 2 0 100-4 2 2 0 000 4z" /><path fill-rule="evenodd" d="M.458 10C1.732 5.943 5.522 3 10 3s8.268 2.943 9.542 7c-1.274 4.057-5.064 7-9.542 7S1.732 14.057.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z" clip-rule="evenodd" /></svg>
            </button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="btn-entrar">Entrar</button>
      </form>

      <a class="back" href="index.html">← Volver al inventario</a>
    </div>
  </div>

  <script type="module">
    import { iniciarSesion, observarPerfil, cerrarSesion, inicioDeRol } from "./js/auth.js";

    const params = new URLSearchParams(location.search);
    // Solo se vuelve a una página propia del sitio (nada de "//otro-sitio").
    const volverParam = params.get("volver");
    const volver = volverParam && /^[\w-]+(\.html)?(\?.*)?$/.test(volverParam) ? volverParam : null;

    const errorBox = document.getElementById("error");
    let entrando = false;

    function seguir(perfil) {
      if (!perfil.rol) {
        errorBox.textContent = "Tu cuenta no tiene un rol asignado. Pídele a bodega que lo revise.";
        errorBox.classList.remove("hidden");
        cerrarSesion();
        return false;
      }
      const destino = volver || inicioDeRol(perfil.rol);
      location.replace(perfil.debeCambiarClave ? `cambiar-clave.html?volver=${encodeURIComponent(destino)}` : destino);
      return true;
    }

    // Si ya hay sesión activa, no tiene sentido mostrar el login.
    observarPerfil((perfil) => {
      if (perfil && !entrando) seguir(perfil);
    });

    const form = document.getElementById("form-login");
    const btn = document.getElementById("btn-entrar");

    // Ojito para mostrar/ocultar la contraseña mientras se escribe.
    const ICONO_OJO = `<svg viewBox="0 0 20 20" fill="currentColor" width="20" height="20"><path d="M10 12a2 2 0 100-4 2 2 0 000 4z" /><path fill-rule="evenodd" d="M.458 10C1.732 5.943 5.522 3 10 3s8.268 2.943 9.542 7c-1.274 4.057-5.064 7-9.542 7S1.732 14.057.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z" clip-rule="evenodd" /></svg>`;
    const ICONO_OJO_TACHADO = `<svg viewBox="0 0 20 20" fill="currentColor" width="20" height="20"><path fill-rule="evenodd" d="M3.707 2.293a1 1 0 00-1.414 1.414l14 14a1 1 0 001.414-1.414l-1.473-1.473A10.014 10.014 0 0019.542 10C18.268 5.943 14.478 3 10 3a9.958 9.958 0 00-4.512 1.074l-1.78-1.781zm4.261 4.26l1.514 1.515a2.003 2.003 0 012.45 2.45l1.514 1.514a4 4 0 00-5.478-5.478z" clip-rule="evenodd" /><path d="M12.454 16.697L9.75 13.992a4 4 0 01-3.742-3.741L2.335 6.578A9.98 9.98 0 00.458 10c1.274 4.057 5.065 7 9.542 7 .847 0 1.669-.105 2.454-.303z" /></svg>`;
    const passwordInput = document.getElementById("password");
    const btnVerPassword = document.getElementById("btn-ver-password");
    btnVerPassword.addEventListener("click", () => {
      const mostrando = passwordInput.type === "text";
      passwordInput.type = mostrando ? "password" : "text";
      btnVerPassword.innerHTML = mostrando ? ICONO_OJO : ICONO_OJO_TACHADO;
      btnVerPassword.setAttribute("aria-label", mostrando ? "Mostrar contraseña" : "Ocultar contraseña");
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorBox.classList.add("hidden");
      btn.disabled = true;
      btn.textContent = "Entrando…";
      entrando = true;
      try {
        const perfil = await iniciarSesion(form.email.value, form.password.value);
        if (!seguir(perfil)) { entrando = false; btn.disabled = false; btn.textContent = "Entrar"; }
      } catch (err) {
        entrando = false;
        errorBox.textContent = err.message;
        errorBox.classList.remove("hidden");
        btn.disabled = false;
        btn.textContent = "Entrar";
      }
    });
  </script>
</body>
</html>
