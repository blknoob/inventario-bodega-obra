<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seguimiento de compra | Inventario de Bodega</title>
  <link rel="stylesheet" href="css/styles.css" />
  <!-- SheetJS: lee el Excel del pedido en el navegador (no sube el archivo a ningún servidor para leerlo). -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
  <header id="topbar"></header>

  <div class="wrap">
    <div id="flash" class="alert hidden"></div>

    <div class="page-head">
      <h1>Seguimiento de compra</h1>
      <p>Pedido de Materiales (PM)</p>
    </div>

    <div class="grid" style="margin-bottom: 18px;">
      <div class="stat">
        <div class="label">Pedidos (PM)</div>
        <div class="value" id="stat-pedidos">—</div>
      </div>
      <div class="stat">
        <div class="label">Sin llegar (10+ días)</div>
        <div class="value stock-bajo" id="stat-sin-comprar">—</div>
      </div>
    </div>

    <div id="alerta-sin-comprar" class="alert alert-warn hidden"></div>

    <div class="card">
      <div class="toolbar">
        <div class="filters">
          <input type="search" id="buscar" placeholder="Buscar pedido, solicitante, ítem…" autocomplete="off" />
        </div>
        <div class="row-actions only-bodega">
          <button class="btn btn-primary" id="btn-nuevo-pedido">Nuevo pedido</button>
        </div>
      </div>
    </div>

    <div id="lista-pedidos"></div>
  </div>

  <!-- ── Modal: nuevo pedido de materiales (PM) ──────────────────────────── -->
  <dialog id="dlg-pedido">
    <div class="modal-head">
      <h3>Nuevo Pedido de Materiales</h3>
      <button type="button" class="modal-close" data-close>&times;</button>
    </div>
    <form id="form-pedido">
      <div id="err-pedido" class="alert alert-error hidden"></div>

      <div class="row">
        <div class="field">
          <label for="p-numero">N.º de pedido / folio</label>
          <input type="text" id="p-numero" maxlength="40" placeholder="PM-001" />
        </div>
        <div class="field">
          <label for="p-solicitante">Solicitante <span class="muted">(opcional)</span></label>
          <input type="text" id="p-solicitante" maxlength="80" />
        </div>
      </div>
      <div class="field">
        <label for="p-observacion">Observación <span class="muted">(opcional)</span></label>
        <input type="text" id="p-observacion" maxlength="160" />
      </div>
      <div class="field">
        <label for="p-archivo">Excel del pedido</label>
        <input type="file" id="p-archivo" accept=".xlsx,.xls,.csv" required />
        <p class="text-sm muted" id="p-archivo-estado" style="margin-top: 6px;">
          <!-- El PM solo se carga a través de un Excel: al elegir el archivo, sus ítems se leen automáticamente abajo (columnas esperadas: línea, centro de gestión, centro de costo, cantidad, unidad, glosa). -->
        </p>
      </div>

      <div class="field">
        <label>Ítems detectados</label>
        <div class="table-wrap" style="max-height: 260px; overflow-y: auto;">
          <table>
            <thead><tr><th>Línea</th><th>Glosa</th><th>C. gestión</th><th>C. costo</th><th class="text-right">Cantidad</th><th>Unidad</th></tr></thead>
            <tbody id="p-items"><tr><td colspan="6" class="empty">Elige el Excel para ver los ítems.</td></tr></tbody>
          </table>
        </div>
      </div>

      <div class="modal-foot">
        <button type="button" class="btn btn-ghost" data-close>Cancelar</button>
        <button type="submit" class="btn btn-primary" id="btn-guardar-pedido">Guardar pedido</button>
      </div>
    </form>
  </dialog>

  <script type="module">
    import { montarTopbar, flash } from "./js/ui.js";
    import {
      escucharPedidos, escucharOrdenes, crearPedido, eliminarPedido,
      leerItemsDeExcel, itemsSinLlegar, cantidadRecibidaDe, DIAS_ALERTA_SIN_LLEGAR,
    } from "./js/compras.js";

    montarTopbar("compras");

    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const fmtNum = (n) => (Number(n) || 0).toLocaleString("es-CL", { maximumFractionDigits: 3 });
    const fmtFecha = (ts) => {
      const d = ts?.toDate?.();
      if (!d) return "—";
      return d.toLocaleDateString("es-CL") + " " +
        d.toLocaleTimeString("es-CL", { hour: "2-digit", minute: "2-digit" });
    };

    let pedidos = [];
    let ordenes = [];
    const lista = document.getElementById("lista-pedidos");
    const buscar = document.getElementById("buscar");

    function render() {
      const q = buscar.value.trim().toLowerCase();
      const vista = !q ? pedidos : pedidos.filter((p) =>
        [p.numero, p.solicitante, ...(p.items || []).map((it) => it.glosa)]
          .some((v) => (v || "").toLowerCase().includes(q)));

      document.getElementById("stat-pedidos").textContent = pedidos.length;

      const sinLlegar = itemsSinLlegar(pedidos, ordenes);
      document.getElementById("stat-sin-comprar").textContent = sinLlegar.length;

      const alerta = document.getElementById("alerta-sin-comprar");
      if (sinLlegar.length) {
        alerta.classList.remove("hidden");
        alerta.innerHTML = `⚠ <strong>${sinLlegar.length}</strong> ítem${sinLlegar.length > 1 ? "s llevan" : " lleva"} ${DIAS_ALERTA_SIN_LLEGAR}+ días sin llegar completo a bodega: ` +
          sinLlegar.map((r) => `${esc(r.item.glosa)} (${esc(r.pedido.numero) || "sin folio"}, faltan ${fmtNum(r.pendiente)}, ${r.dias} días)`).join(" · ");
      } else {
        alerta.classList.add("hidden");
      }

      if (!vista.length) {
        lista.innerHTML = `<div class="card"><p class="empty">${
          pedidos.length ? "Sin resultados para el filtro." : "Aún no hay pedidos de materiales registrados."
        }</p></div>`;
        return;
      }

      lista.innerHTML = vista.map((p) => {
        // Solo interesa ver acá lo que todavía falta por llegar -- una vez
        // completo, el ítem ya cumplió su parte y no hace falta seguir
        // viéndolo en el seguimiento.
        const itemsPendientes = (p.items || []).filter((it) => {
          const recibido = cantidadRecibidaDe(ordenes, p.id, it.id);
          return recibido < (Number(it.cantidad) || 0);
        });
        return `
        <div class="card">
          <div class="row-actions" style="justify-content: space-between; align-items: flex-start; margin-bottom: 10px;">
            <div>
              <div style="font-weight: 700;">${esc(p.numero) || "(sin folio)"} <span class="muted text-sm">— ${fmtFecha(p.creadoEn)}</span></div>
              <div class="text-sm muted">
                ${p.solicitante ? `Solicita: ${esc(p.solicitante)}` : ""}
                ${p.observacion ? ` · ${esc(p.observacion)}` : ""}
              </div>
              ${p.archivo ? `<div class="text-sm"><a href="${esc(p.archivo.url)}" target="_blank" rel="noopener">📎 ${esc(p.archivo.nombre)}</a></div>` : ""}
            </div>
            <div class="row-actions only-bodega">
              <button class="btn btn-ghost btn-xs btn-danger" data-eliminar-pedido="${p.id}">Eliminar</button>
            </div>
          </div>

          ${itemsPendientes.length ? `
          <details class="pm-pendientes">
            <summary>${itemsPendientes.length} ítem${itemsPendientes.length === 1 ? "" : "s"} pendiente${itemsPendientes.length === 1 ? "" : "s"} por llegar</summary>
            <div class="table-wrap">
              <table>
                <thead><tr><th>Línea</th><th>Glosa</th><th>Centro de gestión</th><th>Centro de costo</th><th class="text-right">Cantidad</th><th>Estado</th></tr></thead>
                <tbody>
                  ${itemsPendientes.map((it) => {
                    const recibido = cantidadRecibidaDe(ordenes, p.id, it.id);
                    const pedida = Number(it.cantidad) || 0;
                    const estado = recibido <= 0
                      ? `<span class="badge badge-warn">Sin llegar</span>`
                      : `<span class="badge badge-muted">Incompleto: ${fmtNum(recibido)}/${fmtNum(pedida)}</span>`;
                    return `
                    <tr>
                      <td class="muted">${esc(it.linea) || "—"}</td>
                      <td>${esc(it.glosa)}</td>
                      <td>${esc(it.centroGestion) || "<span class='muted'>—</span>"}</td>
                      <td>${esc(it.centroCosto) || "<span class='muted'>—</span>"}</td>
                      <td class="text-right nowrap">${fmtNum(it.cantidad)} ${esc(it.unidad)}</td>
                      <td>${estado}</td>
                    </tr>`;
                  }).join("")}
                </tbody>
              </table>
            </div>
          </details>
          ` : `<p class="text-sm"><span class="badge badge-ok">Completo</span> Todo lo pedido en este PM ya llegó a bodega.</p>`}
        </div>`;
      }).join("");
    }

    buscar.addEventListener("input", render);

    escucharPedidos(
      (items) => { pedidos = items; render(); },
      (err) => { lista.innerHTML = `<div class="card"><p class="empty">Error al cargar: ${esc(err.message)}</p></div>`; },
    );
    escucharOrdenes(
      (items) => { ordenes = items; render(); },
      () => {},
    );

    // ── Modales: apertura/cierre comunes ────────────────────────────────
    document.querySelectorAll("dialog [data-close]").forEach((b) =>
      b.addEventListener("click", () => b.closest("dialog").close()));

    // ── Nuevo pedido: los ítems se leen del Excel y quedan en memoria; la
    // tabla de abajo es solo para revisarlos, no hace falta tocarla para
    // guardar el pedido. ────────────────────────────────────────────────
    const pItems = document.getElementById("p-items");
    let itemsPedidoActual = [];

    function pintarItemsPedido() {
      pItems.innerHTML = itemsPedidoActual.length
        ? itemsPedidoActual.map((it) => `
            <tr>
              <td class="muted">${esc(it.linea) || "—"}</td>
              <td>${esc(it.glosa)}</td>
              <td>${esc(it.centroGestion) || "<span class='muted'>—</span>"}</td>
              <td>${esc(it.centroCosto) || "<span class='muted'>—</span>"}</td>
              <td class="text-right nowrap">${esc(it.cantidad)}</td>
              <td>${esc(it.unidad)}</td>
            </tr>`).join("")
        : `<tr><td colspan="6" class="empty">Elige el Excel para ver los ítems.</td></tr>`;
    }

    const dlgPedido = document.getElementById("dlg-pedido");
    const formPedido = document.getElementById("form-pedido");
    const errPedido = document.getElementById("err-pedido");
    const pArchivo = document.getElementById("p-archivo");
    const pArchivoEstado = document.getElementById("p-archivo-estado");
    const textoAyudaArchivo = pArchivoEstado?.textContent ?? "";

    document.getElementById("btn-nuevo-pedido").addEventListener("click", () => {
      formPedido.reset();
      itemsPedidoActual = [];
      pintarItemsPedido();
      if (pArchivoEstado) {
        pArchivoEstado.textContent = textoAyudaArchivo;
        pArchivoEstado.classList.remove("stock-cero");
      }
      errPedido.classList.add("hidden");
      dlgPedido.showModal();
    });

    // Al elegir el Excel, se leen sus ítems al tiro y quedan listos para
    // guardar; la tabla de abajo solo los muestra para revisarlos.
    pArchivo.addEventListener("change", async () => {
      const archivo = pArchivo.files[0];
      itemsPedidoActual = [];
      pintarItemsPedido();
      if (!archivo) return;
      if (pArchivoEstado) {
        pArchivoEstado.textContent = "Leyendo el Excel…";
        pArchivoEstado.classList.remove("stock-cero");
      }
      try {
        itemsPedidoActual = await leerItemsDeExcel(archivo);
        pintarItemsPedido();
        if (pArchivoEstado) {
          pArchivoEstado.textContent = `${itemsPedidoActual.length} ítem${itemsPedidoActual.length > 1 ? "s" : ""} detectado${itemsPedidoActual.length > 1 ? "s" : ""} del Excel.`;
        }
      } catch (err) {
        if (pArchivoEstado) {
          pArchivoEstado.textContent = err.message;
          pArchivoEstado.classList.add("stock-cero");
        } else {
          flash(err.message, "error");
        }
      }
    });

    formPedido.addEventListener("submit", async (e) => {
      e.preventDefault();
      errPedido.classList.add("hidden");
      const btn = document.getElementById("btn-guardar-pedido");
      btn.disabled = true; btn.textContent = "Guardando…";
      try {
        await crearPedido({
          numero: document.getElementById("p-numero").value,
          solicitante: document.getElementById("p-solicitante").value,
          observacion: document.getElementById("p-observacion").value,
          items: itemsPedidoActual,
          archivo: pArchivo.files[0] || null,
        });
        dlgPedido.close();
        flash("Pedido de materiales registrado.");
      } catch (err) {
        errPedido.textContent = err.message;
        errPedido.classList.remove("hidden");
      } finally {
        btn.disabled = false; btn.textContent = "Guardar pedido";
      }
    });

    // ── Eliminar pedido ──────────────────────────────────────────────────
    lista.addEventListener("click", async (e) => {
      const idEliminarPedido = e.target.getAttribute?.("data-eliminar-pedido");
      if (!idEliminarPedido) return;

      const p = pedidos.find((x) => x.id === idEliminarPedido);
      if (!p) return;
      if (!confirm(`¿Eliminar el pedido "${p.numero || "(sin folio)"}"? No borra las órdenes de compra ya creadas.`)) return;
      try {
        await eliminarPedido(p);
        flash("Pedido eliminado.");
      } catch (err) { flash(err.message, "error"); }
    });

  </script>
</body>
</html>
