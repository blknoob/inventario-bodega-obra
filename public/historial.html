<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Historial | Inventario de Bodega</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header id="topbar"></header>

  <div class="wrap">
    <div id="flash" class="alert hidden"></div>
    <div class="page-head">
      <h1>Historial</h1>
     
    </div>

    <div class="grid" style="margin-bottom: 18px;">
      <button type="button" class="stat" id="stat-entradas-card">
        <div class="label">Entrantes</div>
        <div class="value stock-ok" id="stat-entradas">—</div>
      </button>
      <button type="button" class="stat" id="stat-salidas-card">
        <div class="label">Salientes</div>
        <div class="value" id="stat-salidas" style="color: var(--info);">—</div>
      </button>
      <button type="button" class="stat" id="stat-sin-oc-card">
        <div class="label">Entradas sin orden de compra</div>
        <div class="value stock-bajo" id="stat-sin-oc">—</div>
      </button>
    </div>

    <div class="card">
      <div class="toolbar">
        <div class="filters">
          <input type="search" id="buscar" placeholder="Buscar producto, persona, proveedor, vale…" autocomplete="off" />
          <select id="filtro-tipo">
            <option value="">Todos los movimientos</option>
            <option value="entrada">Entrantes</option>
            <option value="salida">Salientes</option>
          </select>
          <select id="filtro-categoria">
            <option value="">Todas las categorías</option>
          </select>
          <select id="filtro-oc">
            <option value="">Todas las órdenes de compra</option>
          </select>
          <input type="date" id="filtro-fecha" />
          <button type="button" class="btn btn-ghost btn-xs" id="btn-fecha-hoy">Hoy</button>
          <label class="text-sm" style="display:flex; align-items:center; gap:6px;">
            <input type="checkbox" id="filtro-sin-oc" style="width:auto;" />
            Solo entradas sin OC
          </label>
        </div>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Fecha</th>
              <th>Tipo</th>
              <th>Producto</th>
              <th>Categoría</th>
              <th class="text-right">Cantidad</th>
              <th class="text-right">Stock resultante</th>
              <th>Detalle</th>
            </tr>
          </thead>
          <tbody id="tbody">
            <tr><td colspan="7" class="empty">Cargando…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- ── Modal: corregir el N.º de orden de compra de un ingreso ───────── -->
  <dialog id="dlg-oc" style="margin:auto;">
    <div class="modal-head">
      <h3 id="oc-titulo">Editar orden de compra</h3>
      <button type="button" class="modal-close" data-close>&times;</button>
    </div>
    <form id="form-oc">
      <div id="err-oc" class="alert alert-error hidden"></div>
      <p class="text-sm muted" id="oc-resumen" style="margin-top:-6px; margin-bottom:12px;"></p>
      <div class="field">
        <label for="oc-numero">N.º de orden de compra</label>
        <input type="text" id="oc-numero" maxlength="40" autocomplete="off" placeholder="Vacío = sin OC" />
      </div>
      <label class="text-sm hidden" id="oc-hermanos-bloque" style="display:flex; align-items:center; gap:6px; margin-bottom:10px;">
        <input type="checkbox" id="oc-hermanos" style="width:auto;" checked />
        <span id="oc-hermanos-texto"></span>
      </label>
      <div class="modal-foot">
        <button type="button" class="btn btn-ghost" data-close>Cancelar</button>
        <button type="submit" class="btn btn-primary" id="btn-guardar-oc">Guardar</button>
      </div>
    </form>
  </dialog>

  <script type="module">
    import { montarTopbar, ubicarDesplegable, flash } from "./js/ui.js";
    import { CATEGORIAS, etiquetaCategoria, escucharMovimientos, facturasDe, ocDe, corregirOrdenCompra } from "./js/materiales.js";
    import { escucharConObraActiva } from "./js/obra.js";

    montarTopbar("historial");

    const optsCat = CATEGORIAS.map((c) => `<option value="${c.valor}">${c.etiqueta}</option>`).join("");
    document.getElementById("filtro-categoria").insertAdjacentHTML("beforeend", optsCat);

    let movimientos = [];
    const tbody = document.getElementById("tbody");
    const buscar = document.getElementById("buscar");
    const filtroTipo = document.getElementById("filtro-tipo");
    const filtroCat = document.getElementById("filtro-categoria");
    const filtroFecha = document.getElementById("filtro-fecha");
    const btnFechaHoy = document.getElementById("btn-fecha-hoy");
    const filtroSinOC = document.getElementById("filtro-sin-oc");
    const filtroOC = document.getElementById("filtro-oc");
    const statEntradasCard = document.getElementById("stat-entradas-card");
    const statSalidasCard = document.getElementById("stat-salidas-card");
    const statSinOcCard = document.getElementById("stat-sin-oc-card");

    // "YYYY-MM-DD" en horario local, para comparar contra <input type="date">.
    const fechaISO = (d) => {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    };
    btnFechaHoy.addEventListener("click", () => {
      filtroFecha.value = fechaISO(new Date());
      render();
    });

    // Si se llega con ?categoria=epp (ej: desde la tarjeta "EPPs" de Inicio),
    // deja el filtro ya aplicado.
    const catInicial = new URL(location.href).searchParams.get("categoria");
    if (catInicial && CATEGORIAS.some((c) => c.valor === catInicial)) {
      filtroCat.value = catInicial;
    }

    const fmtNum = (n) => (Number(n) || 0).toLocaleString("es-CL", { maximumFractionDigits: 3 });
    const fmtFecha = (ts) => {
      const d = ts?.toDate?.();
      if (!d) return "—";
      return d.toLocaleDateString("es-CL") + " " +
        d.toLocaleTimeString("es-CL", { hour: "2-digit", minute: "2-digit" });
    };
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

    // Si la factura es una foto, se ve la miniatura ahí mismo (no solo un
    // link que manda a otra pestaña); "download" hace que el navegador la
    // baje directo en vez de solo mostrarla.
    const esImagen = (nombre) => /\.(jpe?g|png|gif|webp|heic|heif|bmp)$/i.test(nombre || "");
    function vistaFactura(factura) {
      const nombre = esc(factura.nombre);
      const url = esc(factura.url);
      if (esImagen(factura.nombre)) {
        return `<a href="${url}" download="${nombre}" target="_blank" rel="noopener" style="display:inline-block; margin:0 6px 6px 0;">
          <img src="${url}" alt="Factura" style="display:block; max-width:80px; max-height:80px; border-radius:6px; border:1px solid var(--line); object-fit:cover;" />
        </a>`;
      }
      return `<a href="${url}" download="${nombre}" target="_blank" rel="noopener" style="display:inline-block; margin:0 6px 6px 0;">📎 ${nombre}</a>`;
    }

    /** Resumen corto de detalle, visible directo en la fila (lo esencial de
     *  un vistazo: si tiene OC o quién retira). El resto (proveedor,
     *  documento, motivo / supervisor, actividad, zona, vale, observación,
     *  responsable) queda en el modal para no desordenar la lista. */
    function resumenDetalle(m) {
      if (m.tipo === "entrada") {
        return ocDe(m) ? `OC: ${esc(ocDe(m))}` : `<span class="badge badge-warn">Sin OC</span>`;
      }
      return `Retira: ${esc(m.personaRetira || "—")}`;
    }

    /** Detalle completo, como pares [etiqueta, valor], para el modal. */
    function detalleItems(m) {
      const partes = [];
      if (m.tipo === "entrada") {
        partes.push(["N.º de orden de compra",
          (ocDe(m) ? esc(ocDe(m)) : `<span class="badge badge-warn">Sin OC</span>`) +
          ` <button type="button" class="btn btn-ghost btn-xs only-bodega" data-editar-oc="${m.id}">${ocDe(m) ? "Editar" : "Agregar"}</button>`]);
        if (m.ocCorregidaPor) partes.push(["OC corregida por", `${esc(m.ocCorregidaPor)} <span class="muted">${fmtFecha(m.ocCorregidaEn)}</span>`]);
        if (m.unidadesPorCaja) partes.push(["Llegó en", `${fmtNum(m.cajas)} caja${m.cajas === 1 ? "" : "s"} × ${fmtNum(m.unidadesPorCaja)}`]);
        if (m.proveedor) partes.push(["Proveedor", esc(m.proveedor)]);
        if (m.motivo) partes.push(["Motivo", esc(m.motivo)]);
        if (m.observacionRecepcion) partes.push(["Observación de recepción", esc(m.observacionRecepcion)]);
        const facturas = facturasDe(m);
        if (facturas.length) partes.push(["Factura/guía", facturas.map(vistaFactura).join("")]);
        if (m.fleteEmpresa) partes.push(["Traslado (flete)", `${esc(m.fleteEmpresa)} <a href="guias.html" class="text-sm">(ver en Guías)</a>`]);
        if (m.tipoAdquisicion === "arrendada") partes.push(["Adquisición", `Arrendada — ${esc(m.empresaArriendo)}`]);
      } else {
        partes.push(["Retira", esc(m.personaRetira || "—")]);
        if (m.supervisor) partes.push(["Supervisor", esc(m.supervisor)]);
        if (m.actividad) partes.push(["Actividad", esc(m.actividad)]);
        if (m.zona) partes.push(["Zona", esc(m.zona)]);
        if (m.numeroVale) partes.push(["Vale", m.valeId ? `${esc(m.numeroVale)} <a href="vales.html" class="text-sm">(ver en Vales)</a>` : esc(m.numeroVale)]);
        if (m.solicitadoPor) partes.push(["Solicitado por", esc(m.solicitadoPor)]);
        if (m.observacion) partes.push(["Observación", esc(m.observacion)]);
      }
      partes.push(["Responsable", esc(m.responsable) || "—"]);
      return partes;
    }

    // Filtro por orden de compra: las opciones salen de las OC que aparecen
    // en los movimientos de la obra activa (se rearma con cada cambio, sin
    // perder la que estaba elegida). Se compara sin mayúsculas/espacios
    // para que "oc-1002" y "OC-1002 " cuenten como la misma.
    const normOC = (v) => String(v || "").trim().toUpperCase();
    function actualizarOpcionesOC() {
      const elegida = filtroOC.value;
      const conteo = new Map();
      for (const m of movimientos) {
        const n = normOC(ocDe(m));
        if (n) conteo.set(n, (conteo.get(n) || 0) + 1);
      }
      const ocs = [...conteo.keys()].sort((a, b) => b.localeCompare(a, "es", { numeric: true }));
      if (elegida && !conteo.has(elegida)) ocs.unshift(elegida); // no la borra de golpe si deja de aparecer
      filtroOC.innerHTML = `<option value="">Todas las órdenes de compra</option>` +
        ocs.map((n) => `<option value="${esc(n)}">${esc(n)}${conteo.has(n) ? ` (${conteo.get(n)})` : ""}</option>`).join("");
      filtroOC.value = elegida;
    }

    function render() {
      const q = buscar.value.trim().toLowerCase();
      const tipo = filtroTipo.value;
      const cat = filtroCat.value;
      const fecha = filtroFecha.value;
      const soloSinOC = filtroSinOC.checked;
      const oc = filtroOC.value;
      const vista = movimientos.filter((m) =>
        (!tipo || m.tipo === tipo) &&
        (!cat || m.categoria === cat) &&
        (!fecha || (m.fecha?.toDate?.() && fechaISO(m.fecha.toDate()) === fecha)) &&
        (!soloSinOC || (m.tipo === "entrada" && !ocDe(m))) &&
        (!oc || normOC(ocDe(m)) === oc) &&
        (!q || [ocDe(m), m.materialProducto, m.personaRetira, m.proveedor, m.supervisor, m.responsable, m.numeroVale, m.solicitadoPor]
          .some((v) => (v || "").toLowerCase().includes(q))));

      const entradas = movimientos.filter((m) => m.tipo === "entrada");
      document.getElementById("stat-entradas").textContent = entradas.length;
      document.getElementById("stat-salidas").textContent =
        movimientos.filter((m) => m.tipo === "salida").length;
      document.getElementById("stat-sin-oc").textContent =
        entradas.filter((m) => !ocDe(m)).length;

      statEntradasCard.classList.toggle("active", tipo === "entrada");
      statSalidasCard.classList.toggle("active", tipo === "salida");
      statSinOcCard.classList.toggle("active", soloSinOC);

      if (!vista.length) {
        tbody.innerHTML = `<tr><td colspan="7" class="empty">${
          movimientos.length ? "Sin resultados para el filtro." : "Aún no hay movimientos registrados."
        }</td></tr>`;
        return;
      }

      tbody.innerHTML = vista.map((m) => `
        <tr>
          <td class="nowrap text-sm">${fmtFecha(m.fecha)}</td>
          <td><span class="badge ${m.tipo === "entrada" ? "badge-ok" : "badge-info"}">${m.tipo === "entrada" ? "Entrante" : "Saliente"}</span></td>
          <td class="celda-truncar" title="${esc(m.materialProducto)}">${esc(m.materialProducto)}</td>
          <td>${m.categoria ? `<span class="badge badge-muted">${esc(etiquetaCategoria(m.categoria))}</span>` : `<span class="muted text-sm">—</span>`}</td>
          <td class="text-right nowrap">${fmtNum(m.cantidad)}</td>
          <td class="text-right nowrap">${fmtNum(m.stockResultante)}</td>
          <td class="text-sm nowrap detalle-celda">
            <div class="detalle-resumen">
              <span>${resumenDetalle(m)}</span>
              <button type="button" class="btn btn-ghost btn-xs" data-toggle-detalle="${m.id}">Detalle</button>
            </div>
            <div class="detalle-panel hidden" data-panel-detalle="${m.id}">
              <p class="text-sm muted" style="margin-bottom:8px;">
                ${fmtFecha(m.fecha)} ·
                <span class="badge ${m.tipo === "entrada" ? "badge-ok" : "badge-info"}">${m.tipo === "entrada" ? "Entrante" : "Saliente"}</span>
              </p>
              <div class="detalle-lista">
                ${detalleItems(m).map(([etiqueta, valor]) => `
                  <div class="detalle-fila">
                    <span class="muted text-sm">${esc(etiqueta)}</span>
                    <span class="text-sm">${valor}</span>
                  </div>`).join("")}
              </div>
            </div>
          </td>
        </tr>`).join("");
    }

    buscar.addEventListener("input", render);
    filtroTipo.addEventListener("change", render);
    filtroCat.addEventListener("change", render);
    filtroFecha.addEventListener("change", render);
    // "Solo entradas sin OC" y una OC puntual se excluyen entre sí.
    filtroSinOC.addEventListener("change", () => {
      if (filtroSinOC.checked) filtroOC.value = "";
      render();
    });
    filtroOC.addEventListener("change", () => {
      if (filtroOC.value) filtroSinOC.checked = false;
      render();
    });

    // Las tarjetas también filtran: un clic aplica el filtro (o lo quita si
    // ya estaba aplicado), igual que el select/checkbox equivalente.
    statEntradasCard.addEventListener("click", () => {
      filtroTipo.value = filtroTipo.value === "entrada" ? "" : "entrada";
      render();
    });
    statSalidasCard.addEventListener("click", () => {
      filtroTipo.value = filtroTipo.value === "salida" ? "" : "salida";
      render();
    });
    statSinOcCard.addEventListener("click", () => {
      filtroSinOC.checked = true;
      filtroOC.value = "";
      render();
    });

    // ── Desplegable de detalle: abre justo bajo el botón "Detalle" de la
    // fila, como un menú -- no un modal aparte. ────────────────────────────
    function cerrarPaneles(exceptoId) {
      document.querySelectorAll(".detalle-panel").forEach((p) => {
        if (p.getAttribute("data-panel-detalle") !== exceptoId) p.classList.add("hidden");
      });
    }
    tbody.addEventListener("click", (e) => {
      const id = e.target.getAttribute?.("data-toggle-detalle");
      if (!id) return;
      const panel = tbody.querySelector(`.detalle-panel[data-panel-detalle="${id}"]`);
      if (!panel) return;
      const yaAbierto = !panel.classList.contains("hidden");
      cerrarPaneles(null);
      panel.classList.toggle("hidden", yaAbierto);
      if (!yaAbierto) ubicarDesplegable(panel, e.target);
    });
    // Flota sobre la página (si no, con pocas filas la tabla lo corta): al
    // hacer scroll o cambiar el tamaño se reacomoda junto a su botón.
    function reubicarAbierto() {
      const panel = tbody.querySelector(".detalle-panel:not(.hidden)");
      if (!panel) return;
      const id = panel.getAttribute("data-panel-detalle");
      const boton = tbody.querySelector(`[data-toggle-detalle="${id}"]`);
      if (boton) ubicarDesplegable(panel, boton);
    }
    window.addEventListener("scroll", reubicarAbierto, { passive: true });
    window.addEventListener("resize", reubicarAbierto);
    document.querySelector(".table-wrap").addEventListener("scroll", reubicarAbierto, { passive: true });
    document.addEventListener("click", (e) => {
      if (!e.target.closest(".detalle-celda")) cerrarPaneles(null);
    });

    // ── Editar / agregar N.º de orden de compra (solo bodega). Si el ingreso
    // viene de un PM, lo recibido se mueve a la orden correcta de ese PM
    // (ver corregirOrdenCompra en js/materiales.js). Se ofrece aplicar el cambio también a los
    // otros productos del MISMO ingreso (registrados juntos: comparten las
    // fotos de la guía, o -- sin fotos -- misma OC, proveedor y momento).
    const dlgOc = document.getElementById("dlg-oc");
    const formOc = document.getElementById("form-oc");
    const errOc = document.getElementById("err-oc");
    const ocNumero = document.getElementById("oc-numero");
    const ocHermanos = document.getElementById("oc-hermanos");
    const ocHermanosBloque = document.getElementById("oc-hermanos-bloque");
    let ocMovimiento = null;
    let ocOtros = [];
    dlgOc.querySelectorAll("[data-close]").forEach((b) => b.addEventListener("click", () => dlgOc.close()));

    function mismoIngreso(a, b) {
      if (a.id === b.id || b.tipo !== "entrada") return false;
      const fa = facturasDe(a).map((f) => f.path || f.url).sort().join("|");
      const fb = facturasDe(b).map((f) => f.path || f.url).sort().join("|");
      if (fa || fb) return fa === fb;
      const ta = a.fecha?.toDate?.()?.getTime() || 0;
      const tb = b.fecha?.toDate?.()?.getTime() || 0;
      return ocDe(a) === ocDe(b) && (a.proveedor || "") === (b.proveedor || "") && Math.abs(ta - tb) < 5 * 60 * 1000;
    }

    tbody.addEventListener("click", (e) => {
      const id = e.target.getAttribute?.("data-editar-oc");
      if (!id) return;
      const m = movimientos.find((x) => x.id === id);
      if (!m) return;
      cerrarPaneles(null);
      ocMovimiento = m;
      ocOtros = movimientos.filter((x) => mismoIngreso(m, x));
      document.getElementById("oc-resumen").textContent =
        `${m.materialProducto} — ingreso del ${fmtFecha(m.fecha)}${m.proveedor ? ` · ${m.proveedor}` : ""}`;
      ocNumero.value = ocDe(m);
      document.getElementById("oc-titulo").textContent = ocDe(m) ? "Editar orden de compra" : "Agregar orden de compra";
      ocHermanosBloque.classList.toggle("hidden", !ocOtros.length);
      ocHermanos.checked = true;
      document.getElementById("oc-hermanos-texto").textContent = ocOtros.length
        ? `Aplicar también a ${ocOtros.length === 1 ? "el otro producto" : `los otros ${ocOtros.length} productos`} de este mismo ingreso (${ocOtros.map((x) => x.materialProducto).join(", ")})`
        : "";
      errOc.classList.add("hidden");
      dlgOc.showModal();
      ocNumero.select();
    });

    formOc.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!ocMovimiento) return;
      const btn = document.getElementById("btn-guardar-oc");
      btn.disabled = true; btn.textContent = "Guardando…";
      errOc.classList.add("hidden");
      try {
        const lote = [ocMovimiento, ...(ocHermanos.checked ? ocOtros : [])];
        await corregirOrdenCompra(lote, ocNumero.value);
        dlgOc.close();
        flash(lote.length === 1 ? "Orden de compra guardada." : `Orden de compra guardada en ${lote.length} productos.`);
      } catch (err) {
        errOc.textContent = err.message;
        errOc.classList.remove("hidden");
      } finally {
        btn.disabled = false; btn.textContent = "Guardar";
      }
    });

    escucharConObraActiva(
      escucharMovimientos,
      (items) => { movimientos = items; actualizarOpcionesOC(); render(); },
      (err) => {
        tbody.innerHTML = `<tr><td colspan="8" class="empty">Error al cargar: ${esc(err.message)}</td></tr>`;
      },
    );
  </script>
</body>
</html>
