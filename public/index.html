<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Control de Inventario de Bodega CCLP II</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header id="topbar"></header>

  <div class="wrap">
    <div class="page-head">
      <h1>Inventario de bodega — Obra</h1>
      <p>Control de materiales y herramientas.</p>
    </div>

    <div class="grid">
      <a class="stat" href="materiales.html">
        <div class="label">Materiales</div>
        <div class="value" id="stat-materiales">—</div>
      </a>
      <a class="stat" href="materiales.html?categoria=epp">
        <div class="label">EPPs</div>
        <div class="value" id="stat-epp">—</div>
      </a>
      <a class="stat" href="herramientas.html">
        <div class="label">Herramientas</div>
        <div class="value" id="stat-herramientas">—</div>
      </a>
      <a class="stat" href="materiales.html">
        <div class="label">Alertas de stock</div>
        <div class="value" id="stat-alertas">—</div>
      </a>
    </div>

    <div class="card">
      <h2>Estado</h2>
      <p class="text-sm muted" id="estado-conexion">Conectando con la base de datos…</p>
      <p class="text-sm mt">
        <a href="materiales.html">Materiales</a> ya está activo.
        <a href="herramientas.html">Herramientas</a> llega en el Tramo 4.
      </p>
    </div>
  </div>

  <script type="module">
    import { montarTopbar } from "./js/ui.js";
    import { escucharMateriales, nivelStock } from "./js/materiales.js";

    montarTopbar("inicio");
    const estado = document.getElementById("estado-conexion");

    escucharMateriales(
      (items) => {
        estado.textContent = "Base de datos conectada.";
        document.getElementById("stat-materiales").textContent = items.length;
        const epp = items.filter((m) => m.categoria === "epp").length;
        document.getElementById("stat-epp").textContent = epp;
        const alertas = items.filter((m) => nivelStock(m) !== "ok").length;
        document.getElementById("stat-alertas").textContent = alertas;
      },
      (err) => { estado.textContent = "Error de conexión: " + err.message; },
    );
  </script>
</body>
</html>
