<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Control de Inventario de Bodega</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header id="topbar"></header>

  <div class="wrap">
    <div class="page-head">
      <h1>Inventario de bodega</h1>
      <p>Control de materiales, EPPs y herramientas.</p>
    </div>

    <div id="error-conexion" class="alert alert-error hidden"></div>

    <div class="grid">
      <a class="stat" href="materiales.html">
        <div class="label">Materiales</div>
        <div class="value" id="stat-materiales">—</div>
      </a>
      <a class="stat" href="materiales.html?categoria=epp">
        <div class="label">EPPs</div>
        <div class="value" id="stat-epp">—</div>
      </a>
      <a class="stat" href="materiales.html?categoria=herramienta">
        <div class="label">Herramientas</div>
        <div class="value" id="stat-herramientas">—</div>
      </a>
      <a class="stat" href="materiales.html?alertas=1">
        <div class="label">Alertas de stock</div>
        <div class="value" id="stat-alertas">—</div>
      </a>
    </div>
  </div>

  <script type="module">
    import { montarTopbar } from "./js/ui.js";
    import { escucharMateriales, nivelStock } from "./js/materiales.js";
    import { escucharObraActiva, esDeObraActiva } from "./js/obra.js";

    montarTopbar("inicio");
    const errorConexion = document.getElementById("error-conexion");

    // Se guarda sin filtrar para poder refiltrar por obra activa sin
    // esperar un nuevo snapshot (ver escucharObraActiva más abajo).
    let materialesRaw = [];
    function actualizarStats() {
      const items = materialesRaw.filter((m) => esDeObraActiva(m.obra));
      const materiales = items.filter((m) => !["epp", "herramienta"].includes(m.categoria));
      const epps = items.filter((m) => m.categoria === "epp");
      const herramientas = items.filter((m) => m.categoria === "herramienta");
      document.getElementById("stat-materiales").textContent = materiales.length;
      document.getElementById("stat-epp").textContent = epps.length;
      document.getElementById("stat-herramientas").textContent = herramientas.length;
      const alertas = items.filter((m) => nivelStock(m) !== "ok").length;
      document.getElementById("stat-alertas").textContent = alertas;
    }

    escucharMateriales(
      (items) => {
        materialesRaw = items;
        actualizarStats();
      },
      (err) => {
        errorConexion.textContent = "Error de conexión: " + err.message;
        errorConexion.classList.remove("hidden");
      },
    );
    escucharObraActiva(actualizarStats);
  </script>
</body>
</html>
