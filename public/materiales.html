<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Materiales | Inventario de Bodega</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header id="topbar"></header>

  <div class="wrap">
    <div id="flash" class="alert hidden"></div>

    <div class="page-head">
      <h1>Materiales</h1>
      <p>Consumibles, EPP, equipos y herramientas</p>
    </div>

    <div class="grid" style="margin-bottom: 18px;">
      <div class="stat">
        <div class="label">Tipos de material</div>
        <div class="value" id="stat-total">—</div>
      </div>
      <div class="stat">
        <div class="label">Con stock bajo</div>
        <div class="value stock-bajo" id="stat-bajo">—</div>
      </div>
      <div class="stat">
        <div class="label">Sin stock</div>
        <div class="value stock-cero" id="stat-cero">—</div>
      </div>
    </div>

    <div id="alerta-stock" class="alert alert-info hidden"></div>

    <div class="card">
      <div class="toolbar">
        <div class="filters">
          <input type="search" id="buscar" placeholder="Buscar material…" autocomplete="off" />
          <select id="filtro-categoria">
            <option value="">Todas las categorías</option>
          </select>
        </div>
        <div class="row-actions only-bodega">
          <button class="btn btn-primary" id="btn-entrante">Material entrante</button>
          <button class="btn btn-secondary" id="btn-saliente">Material saliente</button>
        </div>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Item</th>
              <th>Producto</th>
              <th>Categoría</th>
              <th>Medida</th>
              <th>Centro de gestión</th>
              <th>Centro de costo</th>
              <th class="text-right">Stock</th>
              <th>Ubicación</th>
              <th>Actualizado</th>
              <th class="only-bodega"></th>
            </tr>
          </thead>
          <tbody id="tbody">
            <tr><td colspan="10" class="empty">Cargando…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- ── Modal: material entrante ──────────────────────────────────────── -->
  <dialog id="dlg-entrante">
    <div class="modal-head">
      <h3>Material entrante</h3>
      <button type="button" class="modal-close" data-close>&times;</button>
    </div>
    <form id="form-entrante">
      <div id="err-entrante" class="alert alert-error hidden"></div>

      <div class="field">
        <div style="display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:6px;">
          <label for="e-producto" style="margin-bottom:0;">Producto</label>
          <button type="button" class="btn btn-ghost btn-xs" id="btn-producto-nuevo">+ Producto nuevo</button>
        </div>
        <select id="e-producto" required>
          <option value="">Selecciona un producto…</option>
        </select>
      </div>
      <p class="text-sm muted" id="e-stock-actual" style="margin-top:-8px; margin-bottom:14px;"></p>

      <div id="e-nuevo-campos" class="hidden">
        <div class="field">
          <label for="e-nuevo-producto">Nombre del producto</label>
          <input type="text" id="e-nuevo-producto" maxlength="120" placeholder="Ej: Cemento Portland 25 kg" />
        </div>
        <div class="row">
          <div class="field">
            <label for="e-nuevo-categoria">Categoría</label>
            <select id="e-nuevo-categoria"></select>
          </div>
          <div class="field">
            <label for="e-nuevo-unidad">Unidad</label>
            <input type="text" id="e-nuevo-unidad" maxlength="20" placeholder="sacos, unidades, m, kg…" />
          </div>
        </div>
        <div class="field">
          <label for="e-nuevo-medida">Medida <span class="muted">(opcional)</span></label>
          <input type="text" id="e-nuevo-medida" maxlength="40" placeholder="Ej: 1/2 pulgada, 25 kg…" />
        </div>
        <div class="row">
          <div class="field">
            <label for="e-nuevo-centro-gestion">Centro de gestión <span class="muted">(opcional)</span></label>
            <input type="text" id="e-nuevo-centro-gestion" maxlength="60" />
          </div>
          <div class="field">
            <label for="e-nuevo-centro-costo">Centro de costo <span class="muted">(opcional)</span></label>
            <input type="text" id="e-nuevo-centro-costo" maxlength="60" />
          </div>
        </div>
        <div class="row">
          <div class="field">
            <label for="e-nuevo-minimo">Stock mínimo (alerta)</label>
            <input type="number" id="e-nuevo-minimo" min="0" step="any" value="0" />
          </div>
          <div class="field">
            <label for="e-nuevo-ubicacion">Ubicación <span class="muted">(opcional)</span></label>
            <input type="text" id="e-nuevo-ubicacion" maxlength="60" placeholder="Rack A-3, Patio…" />
          </div>
        </div>
        <div class="field">
          <label for="e-nuevo-descripcion">Descripción <span class="muted">(opcional)</span></label>
          <textarea id="e-nuevo-descripcion" rows="2" maxlength="300"></textarea>
        </div>
      </div>

      <div class="row">
        <div class="field">
          <label for="e-cantidad">Cantidad recibida</label>
          <input type="number" id="e-cantidad" required min="0" step="any" />
        </div>
        <div class="field">
          <label for="e-documento">N.º guía / factura <span class="muted">(opcional)</span></label>
          <input type="text" id="e-documento" maxlength="40" />
        </div>
      </div>
      <div class="field">
        <label for="e-proveedor">Proveedor <span class="muted">(opcional)</span></label>
        <input type="text" id="e-proveedor" maxlength="80" />
      </div>
      <div class="field">
        <label for="e-motivo">Observación <span class="muted">(opcional)</span></label>
        <input type="text" id="e-motivo" maxlength="120" placeholder="Llegada de material" />
      </div>
      <p class="text-sm muted">La foto de la guía se agrega en el Tramo 3.</p>
      <div class="modal-foot">
        <button type="button" class="btn btn-ghost" data-close>Cancelar</button>
        <button type="submit" class="btn btn-primary" id="btn-guardar-entrante">Registrar</button>
      </div>
    </form>
  </dialog>

  <!-- ── Modal: material saliente ──────────────────────────────────────── -->
  <dialog id="dlg-saliente">
    <div class="modal-head">
      <h3>Material saliente</h3>
      <button type="button" class="modal-close" data-close>&times;</button>
    </div>
    <form id="form-saliente">
      <div id="err-saliente" class="alert alert-error hidden"></div>

      <div class="field">
        <label for="s-producto">Producto</label>
        <select id="s-producto" required>
          <option value="">Selecciona un producto…</option>
        </select>
      </div>
      <p class="text-sm muted" id="s-stock-actual" style="margin-top:-8px; margin-bottom:14px;"></p>

      <div class="row">
        <div class="field">
          <label for="s-cantidad">Cantidad</label>
          <input type="number" id="s-cantidad" required min="0" step="any" />
        </div>
        <div class="field">
          <label for="s-numero-vale">N.º de vale <span class="muted">(opcional)</span></label>
          <input type="text" id="s-numero-vale" maxlength="40" />
        </div>
      </div>
      <div class="row">
        <div class="field">
          <label for="s-persona-retira">Persona que retira</label>
          <input type="text" id="s-persona-retira" required maxlength="80" />
        </div>
        <div class="field">
          <label for="s-supervisor">Supervisor <span class="muted">(opcional)</span></label>
          <input type="text" id="s-supervisor" maxlength="80" />
        </div>
      </div>
      <div class="row">
        <div class="field">
          <label for="s-actividad">Actividad <span class="muted">(opcional)</span></label>
          <input type="text" id="s-actividad" maxlength="80" />
        </div>
        <div class="field">
          <label for="s-zona">Área / zona <span class="muted">(opcional)</span></label>
          <input type="text" id="s-zona" maxlength="60" />
        </div>
      </div>
      <div class="field">
        <label for="s-observacion">Observación <span class="muted">(opcional)</span></label>
        <input type="text" id="s-observacion" maxlength="120" />
      </div>
      <div class="modal-foot">
        <button type="button" class="btn btn-ghost" data-close>Cancelar</button>
        <button type="submit" class="btn btn-primary" id="btn-guardar-saliente">Registrar</button>
      </div>
    </form>
  </dialog>

  <script type="module">
    import { montarTopbar, flash } from "./js/ui.js";
    import {
      CATEGORIAS, etiquetaCategoria, nivelStock,
      escucharMateriales, registrarEntrada, registrarSalida, eliminarMaterial,
    } from "./js/materiales.js";

    montarTopbar("materiales");

    // ── Poblar selects de categoría ───────────────────────────────────────
    const optsCat = CATEGORIAS.map((c) => `<option value="${c.valor}">${c.etiqueta}</option>`).join("");
    document.getElementById("filtro-categoria").insertAdjacentHTML("beforeend", optsCat);
    document.getElementById("e-nuevo-categoria").innerHTML = optsCat;

    // ── Estado y render ───────────────────────────────────────────────────
    let materiales = [];
    const tbody = document.getElementById("tbody");
    const buscar = document.getElementById("buscar");
    const filtroCat = document.getElementById("filtro-categoria");

    const fmtNum = (n) => (Number(n) || 0).toLocaleString("es-CL", { maximumFractionDigits: 3 });
    const fmtFecha = (ts) => {
      const d = ts?.toDate?.();
      if (!d) return "—";
      return d.toLocaleDateString("es-CL") + " " +
        d.toLocaleTimeString("es-CL", { hour: "2-digit", minute: "2-digit" });
    };
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

    function render() {
      const q = buscar.value.trim().toLowerCase();
      const cat = filtroCat.value;
      const vista = materiales.filter((m) =>
        (!cat || m.categoria === cat) &&
        (!q || (m.producto || "").toLowerCase().includes(q)));

      // Estadísticas (sobre todo el inventario, no la vista filtrada)
      const bajos = materiales.filter((m) => nivelStock(m) === "bajo");
      const ceros = materiales.filter((m) => nivelStock(m) === "cero");
      document.getElementById("stat-total").textContent = materiales.length;
      document.getElementById("stat-bajo").textContent = bajos.length;
      document.getElementById("stat-cero").textContent = ceros.length;

      const alerta = document.getElementById("alerta-stock");
      const enAlerta = [...ceros, ...bajos];
      if (enAlerta.length) {
        alerta.classList.remove("hidden");
        alerta.textContent = "Atención: " + enAlerta
          .map((m) => `${m.producto} (${fmtNum(m.stock)} ${m.unidad})`)
          .join(" · ");
      } else {
        alerta.classList.add("hidden");
      }

      if (!vista.length) {
        tbody.innerHTML = `<tr><td colspan="10" class="empty">${
          materiales.length ? "Sin resultados para el filtro." : "Aún no hay materiales cargados."
        }</td></tr>`;
        return;
      }

      tbody.innerHTML = vista.map((m) => {
        const nivel = nivelStock(m);
        const clase = { ok: "stock-ok", bajo: "stock-bajo", cero: "stock-cero" }[nivel];
        return `
          <tr>
            <td class="muted">${m.item ?? "—"}</td>
            <td>
              <div>${esc(m.producto)}</div>
              ${m.descripcion ? `<div class="text-sm muted">${esc(m.descripcion)}</div>` : ""}
            </td>
            <td><span class="badge badge-muted">${esc(etiquetaCategoria(m.categoria))}</span></td>
            <td>${esc(m.medida) || "<span class='muted'>—</span>"}</td>
            <td>${esc(m.centroGestion) || "<span class='muted'>—</span>"}</td>
            <td>${esc(m.centroCosto) || "<span class='muted'>—</span>"}</td>
            <td class="text-right nowrap">
              <span class="stock-num ${clase}">${fmtNum(m.stock)}</span>
              <span class="muted text-sm">${esc(m.unidad)}</span>
              ${m.stockMinimo ? `<div class="text-sm muted">mín. ${fmtNum(m.stockMinimo)}</div>` : ""}
            </td>
            <td>${esc(m.ubicacion) || "<span class='muted'>—</span>"}</td>
            <td class="nowrap text-sm muted">${fmtFecha(m.actualizadoEn)}</td>
            <td class="only-bodega nowrap">
              <button class="btn btn-ghost btn-xs btn-danger" data-eliminar="${m.id}">Eliminar</button>
            </td>
          </tr>`;
      }).join("");
    }

    // ── Selects de producto de los modales (se repueblan con cada cambio) ──
    function opcionesProducto(vacio) {
      const items = [...materiales].sort((a, b) =>
        (a.producto || "").localeCompare(b.producto || "", "es", { sensitivity: "base" }));
      return `<option value="">${vacio}</option>` + items
        .map((m) => `<option value="${m.id}">${esc(m.producto)} — stock ${fmtNum(m.stock)} ${esc(m.unidad)}</option>`)
        .join("");
    }

    function repoblarSelectsProducto() {
      const eSel = document.getElementById("e-producto");
      const sSel = document.getElementById("s-producto");
      const eActual = eSel.value;
      const sActual = sSel.value;
      eSel.innerHTML = opcionesProducto("Selecciona un producto…");
      sSel.innerHTML = opcionesProducto("Selecciona un producto…");
      if ([...eSel.options].some((o) => o.value === eActual)) eSel.value = eActual;
      if ([...sSel.options].some((o) => o.value === sActual)) sSel.value = sActual;
    }

    buscar.addEventListener("input", render);
    filtroCat.addEventListener("change", render);

    escucharMateriales(
      (items) => { materiales = items; render(); repoblarSelectsProducto(); },
      (err) => {
        tbody.innerHTML = `<tr><td colspan="10" class="empty">Error al cargar: ${esc(err.message)}</td></tr>`;
      },
    );

    // ── Eliminar material ───────────────────────────────────────────────
    tbody.addEventListener("click", async (e) => {
      const id = e.target.getAttribute?.("data-eliminar");
      if (!id) return;
      const m = materiales.find((x) => x.id === id);
      if (!m) return;
      const ok = confirm(
        `¿Eliminar "${m.producto}"? Se borra la ficha del catálogo (stock actual: ${fmtNum(m.stock)} ${m.unidad}). El historial de movimientos no se borra. Esta acción no se puede deshacer.`,
      );
      if (!ok) return;
      try {
        await eliminarMaterial(id);
        flash("Material eliminado.");
      } catch (err) {
        flash(err.message, "error");
      }
    });

    // ── Modales: apertura/cierre comunes ────────────────────────────────
    document.querySelectorAll("dialog [data-close]").forEach((b) =>
      b.addEventListener("click", () => b.closest("dialog").close()));

    // ── Material entrante ───────────────────────────────────────────────
    const dlgEntrante = document.getElementById("dlg-entrante");
    const formEntrante = document.getElementById("form-entrante");
    const errEntrante = document.getElementById("err-entrante");
    const eProducto = document.getElementById("e-producto");
    const eNuevoCampos = document.getElementById("e-nuevo-campos");
    const eStockActual = document.getElementById("e-stock-actual");
    const btnProductoNuevo = document.getElementById("btn-producto-nuevo");
    let modoProductoNuevo = false;

    function actualizarVistaEntrante() {
      eNuevoCampos.classList.toggle("hidden", !modoProductoNuevo);
      eProducto.classList.toggle("hidden", modoProductoNuevo);
      eProducto.required = !modoProductoNuevo;
      document.getElementById("e-nuevo-producto").required = modoProductoNuevo;
      btnProductoNuevo.textContent = modoProductoNuevo ? "Elegir producto existente" : "+ Producto nuevo";

      if (!modoProductoNuevo && eProducto.value) {
        const m = materiales.find((x) => x.id === eProducto.value);
        eStockActual.textContent = m ? `Stock actual: ${fmtNum(m.stock)} ${m.unidad}` : "";
      } else {
        eStockActual.textContent = "";
      }
    }
    eProducto.addEventListener("change", actualizarVistaEntrante);
    btnProductoNuevo.addEventListener("click", () => {
      modoProductoNuevo = !modoProductoNuevo;
      if (modoProductoNuevo) eProducto.value = "";
      actualizarVistaEntrante();
    });

    document.getElementById("btn-entrante").addEventListener("click", () => {
      formEntrante.reset();
      document.getElementById("e-nuevo-categoria").innerHTML = optsCat;
      errEntrante.classList.add("hidden");
      modoProductoNuevo = false;
      actualizarVistaEntrante();
      dlgEntrante.showModal();
    });

    formEntrante.addEventListener("submit", async (e) => {
      e.preventDefault();
      errEntrante.classList.add("hidden");
      const btn = document.getElementById("btn-guardar-entrante");
      btn.disabled = true; btn.textContent = "Guardando…";
      try {
        const datos = {
          cantidadRecibida: document.getElementById("e-cantidad").value,
          proveedor: document.getElementById("e-proveedor").value,
          documento: document.getElementById("e-documento").value,
          motivo: document.getElementById("e-motivo").value,
        };
        if (modoProductoNuevo) {
          datos.nuevoMaterial = {
            producto: document.getElementById("e-nuevo-producto").value,
            categoria: document.getElementById("e-nuevo-categoria").value,
            unidad: document.getElementById("e-nuevo-unidad").value,
            medida: document.getElementById("e-nuevo-medida").value,
            centroGestion: document.getElementById("e-nuevo-centro-gestion").value,
            centroCosto: document.getElementById("e-nuevo-centro-costo").value,
            stockMinimo: document.getElementById("e-nuevo-minimo").value,
            ubicacion: document.getElementById("e-nuevo-ubicacion").value,
            descripcion: document.getElementById("e-nuevo-descripcion").value,
          };
        } else {
          if (!eProducto.value) throw new Error("Selecciona un producto.");
          datos.materialId = eProducto.value;
        }
        await registrarEntrada(datos);
        dlgEntrante.close();
        flash("Material entrante registrado.");
      } catch (err) {
        errEntrante.textContent = err.message;
        errEntrante.classList.remove("hidden");
      } finally {
        btn.disabled = false; btn.textContent = "Registrar";
      }
    });

    // ── Material saliente ───────────────────────────────────────────────
    const dlgSaliente = document.getElementById("dlg-saliente");
    const formSaliente = document.getElementById("form-saliente");
    const errSaliente = document.getElementById("err-saliente");
    const sProducto = document.getElementById("s-producto");
    const sStockActual = document.getElementById("s-stock-actual");

    sProducto.addEventListener("change", () => {
      const m = materiales.find((x) => x.id === sProducto.value);
      sStockActual.textContent = m ? `Stock actual: ${fmtNum(m.stock)} ${m.unidad}` : "";
    });

    document.getElementById("btn-saliente").addEventListener("click", () => {
      formSaliente.reset();
      errSaliente.classList.add("hidden");
      sStockActual.textContent = "";
      dlgSaliente.showModal();
    });

    formSaliente.addEventListener("submit", async (e) => {
      e.preventDefault();
      errSaliente.classList.add("hidden");
      const btn = document.getElementById("btn-guardar-saliente");
      btn.disabled = true; btn.textContent = "Guardando…";
      try {
        if (!sProducto.value) throw new Error("Selecciona un producto.");
        await registrarSalida(sProducto.value, {
          cantidad: document.getElementById("s-cantidad").value,
          personaRetira: document.getElementById("s-persona-retira").value,
          supervisor: document.getElementById("s-supervisor").value,
          actividad: document.getElementById("s-actividad").value,
          zona: document.getElementById("s-zona").value,
          numeroVale: document.getElementById("s-numero-vale").value,
          observacion: document.getElementById("s-observacion").value,
        });
        dlgSaliente.close();
        flash("Material saliente registrado.");
      } catch (err) {
        errSaliente.textContent = err.message;
        errSaliente.classList.remove("hidden");
      } finally {
        btn.disabled = false; btn.textContent = "Registrar";
      }
    });
  </script>
</body>
</html>
