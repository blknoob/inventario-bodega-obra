              ${itemsSalidaSeleccionados.length > 1 ? `<button type="button" class="btn btn-ghost btn-xs btn-danger is-quitar">Quitar</button>` : ""}
            </summary>
            <div class="field" style="position:relative; margin-top:10px;">
              <label>Producto</label>
              <input type="text" class="is-buscar buscador-input" placeholder="Busca el producto…" autocomplete="off" value="${esc(item.textoBuscador || "")}" />
              <input type="hidden" class="is-producto" value="${esc(item.materialId || "")}" />
              <div class="is-lista buscador-lista hidden"></div>
            </div>
            <p class="text-sm muted is-stock" style="margin-top:-8px; margin-bottom:10px;">${existente ? `Stock actual: ${fmtNum(existente.stock)} ${esc(existente.unidad)}` : ""}</p>
            <div class="field">
              <label>Cantidad</label>
              <input type="number" class="is-cantidad" min="0" step="any" value="${esc(item.cantidad || "")}" />
            </div>
          </details>`;
      }).join("");

      itemsSalidaCont.querySelectorAll(".item-salida-fila").forEach((fila) => {
        const item = itemsSalidaSeleccionados.find((x) => x.id === fila.getAttribute("data-row-id"));
        wireFilaSalida(fila, item);
        actualizarResumenFilaSalida(fila);
      });
    }

    function wireFilaSalida(fila, item) {
      const input = fila.querySelector(".is-buscar");
      const oculto = fila.querySelector(".is-producto");
      const lista = fila.querySelector(".is-lista");
      const stockTxt = fila.querySelector(".is-stock");

      function renderLista() {
        const q = normalizar(input.value);
        const items = [...materiales]
          .filter((m) => !q || normalizar(m.producto).includes(q))
          .sort((a, b) => (a.producto || "").localeCompare(b.producto || "", "es", { sensitivity: "base" }))
          .slice(0, 30);
        lista.innerHTML = items.length
          ? items.map((m) => `
              <button type="button" class="btn btn-ghost btn-xs" data-id="${m.id}">
                ${esc(m.producto)} — stock ${fmtNum(m.stock)} ${esc(m.unidad)}
              </button>`).join("")
          : `<div class="text-sm muted empty">Sin resultados.</div>`;
        lista.classList.remove("hidden");
      }

      function elegir(m) {
        input.value = m ? m.producto : input.value;
        oculto.value = m?.id || "";
        stockTxt.textContent = m ? `Stock actual: ${fmtNum(m.stock)} ${m.unidad}` : "";
        lista.classList.add("hidden");
        actualizarResumenFilaSalida(fila);
      }

      input.addEventListener("focus", renderLista);
      input.addEventListener("input", () => {
        const existente = materiales.find((m) => normalizar(m.producto) === normalizar(input.value.trim()));
        elegir(existente || null);
        renderLista();
      });
      input.addEventListener("keydown", (e) => { if (e.key === "Escape") lista.classList.add("hidden"); });
      lista.addEventListener("click", (e) => {
        const btn = e.target.closest("[data-id]");
        if (!btn) return;
        elegir(materiales.find((x) => x.id === btn.getAttribute("data-id")));
      });
      fila.querySelector(".is-cantidad").addEventListener("input", () => actualizarResumenFilaSalida(fila));

      fila.querySelector(".is-quitar")?.addEventListener("click", (e) => {
        e.preventDefault();
        e.stopPropagation();
        sincronizarItemsSalidaDesdeDom();
        itemsSalidaSeleccionados = itemsSalidaSeleccionados.filter((x) => x.id !== item.id);
        renderItemsSalida();
      });
    }

    // Listener delegado único (ver el mismo patrón en Material entrante).
    document.addEventListener("click", (e) => {
      itemsSalidaCont.querySelectorAll(".item-salida-fila").forEach((fila) => {
        const input = fila.querySelector(".is-buscar");
        const lista = fila.querySelector(".is-lista");
        if (e.target !== input && !lista.contains(e.target)) lista.classList.add("hidden");
      });
    });

    document.getElementById("btn-agregar-producto-salida").addEventListener("click", () => {
      sincronizarItemsSalidaDesdeDom();
      itemsSalidaSeleccionados.forEach((item) => { item.abierto = false; });
      itemsSalidaSeleccionados.push(nuevaFilaSalida());
      renderItemsSalida();
    });

    document.getElementById("btn-saliente").addEventListener("click", () => {
      formSaliente.reset();
      itemsSalidaSeleccionados = [nuevaFilaSalida()];
      renderItemsSalida();
      errSaliente.classList.add("hidden");
      dlgSaliente.showModal();
    });

    formSaliente.addEventListener("submit", async (e) => {
      e.preventDefault();
      errSaliente.classList.add("hidden");
      const btn = document.getElementById("btn-guardar-saliente");
      btn.disabled = true; btn.textContent = "Guardando…";
      alternarBotonesLista([itemsSalidaCont], true);
      document.getElementById("btn-agregar-producto-salida").disabled = true;
      try {
        if (!itemsSalidaSeleccionados.length) throw new Error("Agrega al menos un producto.");
        const llevarVistaA = (campo) => {
          campo.closest(".item-salida-fila").open = true;
          campo.scrollIntoView({ behavior: "smooth", block: "center" });
          campo.focus();
        };
        const personaRetira = document.getElementById("s-persona-retira").value;
        const supervisor = document.getElementById("s-supervisor").value;
        const actividad = document.getElementById("s-actividad").value;
        const zona = document.getElementById("s-zona").value;
        const numeroVale = document.getElementById("s-numero-vale").value;
        const observacion = document.getElementById("s-observacion").value;

        // Se valida todo ANTES de registrar nada (mismo motivo que en
        // Material entrante): así no queda a mitad de camino un registro
        // por un dato que faltaba desde el principio.
        for (const item of itemsSalidaSeleccionados) {
          const fila = itemsSalidaCont.querySelector(`.item-salida-fila[data-row-id="${item.id}"]`);
          if (!fila) continue; // ya no está en el DOM (se quitó) -- nada que validar
          const campoBuscar = fila.querySelector(".is-buscar");
          if (!fila.querySelector(".is-producto").value) {
            llevarVistaA(campoBuscar);
            throw new Error("Selecciona un producto de la lista en cada fila.");
          }
          const campoCantidad = fila.querySelector(".is-cantidad");
          if (campoCantidad.value === "" || Number.isNaN(Number(campoCantidad.value)) || Number(campoCantidad.value) <= 0) {
            llevarVistaA(campoCantidad);
            throw new Error(`${campoBuscar.value}: ingresa la cantidad.`);
          }
        }

        let registrados = 0;
        for (const item of [...itemsSalidaSeleccionados]) {
          const fila = itemsSalidaCont.querySelector(`.item-salida-fila[data-row-id="${item.id}"]`);
          if (!fila) continue; // ya no está en el DOM (se quitó) -- nada que registrar
          const materialId = fila.querySelector(".is-producto").value;
          const nombreProducto = materiales.find((m) => m.id === materialId)?.producto || "Producto";
          try {
            await registrarSalida(materialId, {
              cantidad: fila.querySelector(".is-cantidad").value,
              personaRetira, supervisor, actividad, zona, numeroVale, observacion,
            });
            registrados++;
            itemsSalidaSeleccionados = itemsSalidaSeleccionados.filter((x) => x.id !== item.id);
          } catch (errItem) {
            sincronizarItemsSalidaDesdeDom();
            renderItemsSalida();
            throw new Error(
              `${nombreProducto}: ${errItem.message}` +
              (registrados ? ` (ya se registraron ${registrados} producto${registrados === 1 ? "" : "s"} antes de este error, no hace falta repetirlos)` : ""),
            );
          }
        }
        renderItemsSalida();
        dlgSaliente.close();
        flash("Material saliente registrado.");
      } catch (err) {
        errSaliente.textContent = err.message;
        errSaliente.classList.remove("hidden");
      } finally {
        btn.disabled = false; btn.textContent = "Registrar";
        alternarBotonesLista([itemsSalidaCont], false);
        document.getElementById("btn-agregar-producto-salida").disabled = false;
      }
    });
  </script>
</body>
</html>
