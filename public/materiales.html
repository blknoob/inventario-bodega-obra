<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="titulo-pagina">Materiales | Inventario de Bodega</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header id="topbar"></header>

  <div class="wrap">
    <div id="flash" class="alert hidden"></div>

    <div class="page-head">
      <h1 id="titulo-h1">Materiales</h1>
      <!-- <p id="titulo-sub">Consumibles, equipos y otros materiales de obra. Los EPP tienen su propia sección.</p> -->
    </div>

    <div class="grid" style="margin-bottom: 18px;">
      <button type="button" class="stat" id="stat-total-card" title="Ver todos">
        <div class="label" id="stat-total-label">Tipos de material</div>
        <div class="value" id="stat-total">—</div>
      </button>
      <button type="button" class="stat" id="stat-bajo-card" title="Ver solo con stock bajo">
        <div class="label">Con stock bajo</div>
        <div class="value stock-bajo" id="stat-bajo">—</div>
      </button>
      <button type="button" class="stat" id="stat-cero-card" title="Ver solo sin stock">
        <div class="label">Sin stock</div>
        <div class="value stock-cero" id="stat-cero">—</div>
      </button>
      <button type="button" class="stat hidden" id="stat-arrendadas-card" title="Ver solo las arrendadas">
        <div class="label">Arrendadas</div>
        <div class="value" id="stat-arrendadas">—</div>
      </button>
    </div>

    <div id="alerta-stock" class="alert alert-info hidden"></div>

    <details id="bloque-arriendos" class="card hidden arriendos-desplegable" style="margin-bottom:18px;">
      <summary id="resumen-arriendos">Herramientas arrendadas por devolver</summary>
      <div id="lista-arriendos"></div>
    </details>

    <div class="card">
      <div class="toolbar">
        <div class="filters">
          <input type="search" id="buscar" placeholder="Buscar material…" autocomplete="off" />
          <select id="filtro-categoria" class="hidden">
            <option value="">Todas las categorías</option>
          </select>
          <select id="filtro-tipo-herramienta" class="hidden">
            <option value="">Todos los tipos</option>
          </select>
          <select id="filtro-adquisicion" class="hidden">
            <option value="">Compradas y arrendadas</option>
            <option value="comprada">Compradas</option>
            <option value="arrendada">Arrendadas</option>
          </select>
        </div>
        <div class="row-actions only-bodega">
          <button class="btn btn-primary" id="btn-entrante">Material entrante</button>
          <button class="btn btn-secondary" id="btn-saliente">Material saliente</button>
        </div>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Producto</th>
              <th>Categoría</th>
              <th class="hidden" id="th-tipo-herramienta">Tipo</th>
              <th class="hidden" id="th-adquisicion">Adquisición</th>
              <th>Medida</th>
              <th>Centro de gestión</th>
              <th>Centro de costo</th>
              <th class="text-right">Stock</th>
              <th>Ubicación</th>
              <th>Actualizado</th>
              <th class="only-bodega"></th>
            </tr>
          </thead>
          <tbody id="tbody">
            <tr><td colspan="9" class="empty">Cargando…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- ── Modal: material entrante ──────────────────────────────────────── -->
  <dialog id="dlg-entrante">
    <div class="modal-head">
      <h3>Material entrante</h3>
      <button type="button" class="modal-close" data-close>&times;</button>
    </div>
    <form id="form-entrante">
      <div id="err-entrante" class="alert alert-error hidden"></div>

      <div class="field">
        <label for="e-documento">N.º Orden de Compra <span class="muted">(opcional)</span></label>
        <input type="text" id="e-documento" maxlength="40" placeholder="" />
      </div>

      <div class="field" style="position:relative;">
        <label for="e-pedido-buscar">Pedido de Materiales (PM)</label>
        <input type="text" id="e-pedido-buscar" class="buscador-input" placeholder="Elige PM" autocomplete="off" />
        <input type="hidden" id="e-pedido" />
        <div id="e-pedido-lista" class="buscador-lista hidden"></div>
      </div>

      <!-- Con un PM elegido: uno o varios productos de ese pedido a la vez -->
      <div class="field hidden" id="bloque-items-pedido">
        <label>Productos</label>
        <button type="button" class="btn btn-ghost btn-block buscador-input" id="btn-elegir-items">Elige productos solicitados en PM...</button>
        <div id="items-pedido-elegidos"></div>
      </div>

      <!-- Sin PM (excepción sin pedido detrás): uno o varios productos a la vez -->
      <div id="bloque-producto-manual">
        <!-- <p class="text-sm muted" id="aviso-sin-orden" style="margin-top:0;">Si esto es una excepción sin pedido detrás (caja chica, casa matriz…), escribe el producto acá: si ya existe lo eliges de la lista, si no, se completa solo para crearlo.</p> -->
        <label>Productos</label>
        <div id="items-manual-lista"></div>
        <button type="button" class="btn btn-ghost btn-block" id="btn-agregar-producto-manual" style="margin-top:8px;">+ Agregar otro producto</button>
      </div>

      <div class="row" style="margin-top:14px;">
        <div class="field">
          <label for="e-proveedor">Proveedor <span class="muted">(opcional)</span></label>
          <input type="text" id="e-proveedor" maxlength="80" />
        </div>
        <div class="field">
          <label for="e-ubicacion">Ubicación <span class="muted">(opcional)</span></label>
          <input type="text" id="e-ubicacion" maxlength="60"/>
        </div>
      </div>
      <div class="field">
        <label for="e-motivo">Observación <span class="muted">(opcional)</span></label>
        <input type="text" id="e-motivo" maxlength="120"/>
      </div>

      <div class="field hidden" id="bloque-tipo-adquisicion">
        <label for="e-tipo-adquisicion">Tipo de adquisición</label>
        <select id="e-tipo-adquisicion">
          <option value="comprada">Comprada</option>
          <option value="arrendada">Arrendada (hay que devolverla)</option>
        </select>
      </div>
      <div class="row hidden" id="campos-arriendo">
        <div class="field">
          <label for="e-arriendo-empresa">Empresa arrendadora</label>
          <input type="text" id="e-arriendo-empresa" maxlength="80" placeholder="Quién la arrendó" />
        </div>
      </div>

      <div class="field">
        <label>Fotos de la factura o guía <span class="muted">(opcional, pueden ser varias)</span></label>
        <div class="row-actions">
          <button type="button" class="btn btn-ghost" id="btn-e-factura-camara">📷 Tomar foto</button>
          <button type="button" class="btn btn-ghost" id="btn-e-factura-archivo">📁 Elegir archivo</button>
        </div>
        <input type="file" id="e-factura" accept="image/*" capture="environment" class="hidden" />
        <input type="file" id="e-factura-archivo" accept="image/*,.pdf" multiple class="hidden" />
        <div id="e-factura-elegida" style="margin-top:6px;"></div>
        <p class="text-sm muted">Quedan disponibles para descargar después en <a href="guias.html" target="_blank" rel="noopener">Guías</a>.</p>
      </div>

      <div class="field" style="position:relative;">
        <label for="e-flete-buscar">Traslado (flete) asociado <span class="muted">(opcional)</span></label>
        <input type="text" id="e-flete-buscar" class="buscador-input" placeholder="Empresa que hizo el traslado…" autocomplete="off" />
        <input type="hidden" id="e-flete" />
        <div id="e-flete-lista" class="buscador-lista hidden"></div>
        <!-- <p class="text-sm muted" style="margin-top:6px;">Si vino con flete de una empresa externa y no lo has registrado, créalo primero en <a href="guias.html" target="_blank" rel="noopener">Guías</a> (con su factura) y elígelo acá.</p> -->
      </div>

      <div class="modal-foot">
        <button type="button" class="btn btn-ghost" data-close>Cancelar</button>
        <button type="submit" class="btn btn-primary" id="btn-guardar-entrante">Registrar</button>
      </div>
    </form>
  </dialog>

  <!-- ── Modal: elegir productos del pedido (selección múltiple) ────────── -->
  <dialog id="dlg-elegir-items">
    <div class="modal-head">
      <h3>Elegir productos del pedido</h3>
      <button type="button" class="modal-close" id="btn-elegir-items-cerrar">&times;</button>
    </div>
    <div style="padding:16px 20px;">
      <input type="search" id="elegir-items-buscar" placeholder="Buscar…" autocomplete="off" style="width:100%; padding:9px 12px; border:1px solid var(--line); border-radius:6px; font-size:14px; font-family:inherit; margin-bottom:12px;" />
      <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
        <button type="button" class="btn btn-ghost btn-xs" id="btn-elegir-items-todos">Seleccionar todos</button>
        <button type="button" class="btn btn-ghost btn-xs" id="btn-elegir-items-limpiar">Limpiar</button>
      </div>
      <div id="elegir-items-lista" style="max-height:320px; overflow-y:auto;"></div>
    </div>
    <div class="modal-foot" style="padding:12px 20px; border-top:1px solid var(--line); margin-top:0; justify-content:space-between;">
      <span class="text-sm muted" id="elegir-items-contador">0 de 0</span>
      <div style="display:flex; gap:10px;">
        <button type="button" class="btn btn-ghost" id="btn-elegir-items-cancelar">Cancelar</button>
        <button type="button" class="btn btn-primary" id="btn-elegir-items-listo">Listo</button>
      </div>
    </div>
  </dialog>

  <!-- ── Modal: material saliente ──────────────────────────────────────── -->
  <dialog id="dlg-saliente">
    <div class="modal-head">
      <h3>Material saliente</h3>
      <button type="button" class="modal-close" data-close>&times;</button>
    </div>
    <form id="form-saliente">
      <div id="err-saliente" class="alert alert-error hidden"></div>

      <label>Productos</label>
      <div id="items-salida-lista"></div>
      <button type="button" class="btn btn-ghost btn-block" id="btn-agregar-producto-salida" style="margin-top:8px; margin-bottom:14px;">+ Agregar otro producto</button>

      <div class="row">
        <div class="field">
          <label for="s-persona-retira">Persona que retira</label>
          <input type="text" id="s-persona-retira" required maxlength="80" />
        </div>
        <div class="field">
          <label for="s-numero-vale">N.º de vale <span class="muted">(opcional)</span></label>
          <input type="text" id="s-numero-vale" maxlength="40" />
        </div>
      </div>
      <div class="row">
        <div class="field">
          <label for="s-supervisor">Supervisor <span class="muted">(opcional)</span></label>
          <input type="text" id="s-supervisor" maxlength="80" />
        </div>
        <div class="field">
          <label for="s-actividad">Actividad <span class="muted">(opcional)</span></label>
          <input type="text" id="s-actividad" maxlength="80" />
        </div>
      </div>
      <div class="row">
        <div class="field">
          <label for="s-zona">Área / zona <span class="muted">(opcional)</span></label>
          <input type="text" id="s-zona" maxlength="60" />
        </div>
      </div>
      <div class="field">
        <label for="s-observacion">Observación <span class="muted">(opcional)</span></label>
        <input type="text" id="s-observacion" maxlength="120" />
      </div>
      <div class="modal-foot">
        <button type="button" class="btn btn-ghost" data-close>Cancelar</button>
        <button type="submit" class="btn btn-primary" id="btn-guardar-saliente">Registrar</button>
      </div>
    </form>
  </dialog>

  <script type="module">
    import { montarTopbar, flash } from "./js/ui.js";
    import {
      CATEGORIAS, etiquetaCategoria, nivelStock,
      TIPOS_HERRAMIENTA, etiquetaTipoHerramienta,
      escucharMateriales, registrarEntrada, registrarSalida, eliminarMaterial, marcarSinReposicion,
      subirFacturasEntrada,
    } from "./js/materiales.js";
    import { escucharPedidos, escucharOrdenes, anotarOrdenDeCompra, cantidadRecibidaDe } from "./js/compras.js";
    import { escucharFletes, etiquetaTipoFlete } from "./js/fletes.js";
    import { escucharArriendos, crearArriendo, devolverHerramienta } from "./js/herramientas.js";
    import { obraActiva, escucharObraActiva, esDeObraActiva } from "./js/obra.js";

    // Esta misma página sirve para cuatro vistas: "Materiales" (todo menos
    // EPP/Herramientas), "EPPs" (?categoria=epp), "Herramientas"
    // (?categoria=herramienta) -- así ninguna de las tres se mezcla en el
    // mismo listado -- y "Alertas de stock" (?alertas=1 desde Inicio, que
    // junta las tres con stock bajo o agotado).
    const params = new URL(location.href).searchParams;
    const categoriaParam = params.get("categoria");
    // null en Materiales (no es una categoría aparte, es "todo lo demás").
    const categoriaPagina = ["epp", "herramienta"].includes(categoriaParam) ? categoriaParam : null;
    const modoEpp = categoriaPagina === "epp";
    const modoHerramienta = categoriaPagina === "herramienta";
    const modoAlertas = params.get("alertas") === "1";
    montarTopbar(modoAlertas ? "" : modoEpp ? "epps" : modoHerramienta ? "herramientas" : "materiales");

    const TITULOS_PAGINA = {
      epp: ["EPPs", "Elementos de protección personal."],
      herramienta: ["Herramientas", "Manuales, eléctricas e inalámbricas."],
    };

    // "titulo-sub" es opcional en el HTML (algunas páginas lo dejan
    // comentado); si no está, se ignora en vez de romper el resto.
    const tituloSub = document.getElementById("titulo-sub");
    if (modoAlertas) {
      document.getElementById("titulo-pagina").textContent = "Alertas de stock | Inventario de Bodega";
      document.getElementById("titulo-h1").textContent = "Alertas de stock";
      if (tituloSub) tituloSub.textContent = "Materiales, EPPs y herramientas con stock bajo o agotado.";
    } else {
      const [titulo, subtitulo] = TITULOS_PAGINA[categoriaPagina] || ["Materiales", "Consumibles, equipos y otros materiales de obra. Los EPP y las Herramientas tienen su propia sección."];
      document.getElementById("titulo-pagina").textContent = `${titulo} | Inventario de Bodega`;
      document.getElementById("titulo-h1").textContent = titulo;
      if (tituloSub) tituloSub.textContent = subtitulo;
    }

    // ── Poblar selects de categoría ─────────────────────────────────────────
    // El filtro de la LISTA sí queda acotado a la página (en Materiales no
    // tiene sentido poder filtrar por "EPP" o "Herramienta": nunca
    // aparecen ahí).
    const CATEGORIAS_DISPONIBLES = modoAlertas
      ? CATEGORIAS
      : categoriaPagina
        ? []
        : CATEGORIAS.filter((c) => !["epp", "herramienta"].includes(c.valor));
    const optsCat = CATEGORIAS_DISPONIBLES.map((c) => `<option value="${c.valor}">${c.etiqueta}</option>`).join("");
    document.getElementById("filtro-categoria").insertAdjacentHTML("beforeend", optsCat);
    document.getElementById("filtro-categoria").classList.toggle("hidden", !!categoriaPagina);

    // Filtros propios de Herramientas: por tipo (manual/eléctrica/
    // inalámbrica) y por si está comprada o arrendada.
    const optsTipoHerramienta = TIPOS_HERRAMIENTA.map((t) => `<option value="${t.valor}">${t.etiqueta}</option>`).join("");
    document.getElementById("filtro-tipo-herramienta").insertAdjacentHTML("beforeend", optsTipoHerramienta);
    document.getElementById("filtro-tipo-herramienta").classList.toggle("hidden", !modoHerramienta);
    document.getElementById("filtro-adquisicion").classList.toggle("hidden", !modoHerramienta);
    document.getElementById("th-tipo-herramienta").classList.toggle("hidden", !modoHerramienta);
    document.getElementById("th-adquisicion").classList.toggle("hidden", !modoHerramienta);
    // Al CREAR un producto nuevo, en cambio, la categoría se elige siempre
    // completa (incluye EPP) sin importar en qué página estás -- un casco
    // sigue siendo EPP aunque llegue junto con cemento y se esté
    // registrando desde "Materiales": no hace falta estar en la página EPP
    // para poder marcarlo como tal.
    function optsCategoriaNuevo(valorElegido = "") {
      // Sin valorElegido, ninguna categoría viene preseleccionada -- hay
      // que elegirla a propósito (el "Elegir una categoría" es un
      // placeholder, no una opción real: no se puede dejar seleccionado).
      // Con valorElegido (p. ej. al redibujar tras un error), se respeta
      // lo que ya se había elegido en vez de volver a pedirlo de cero.
      const opciones = CATEGORIAS.map((c) =>
        `<option value="${c.valor}" ${c.valor === valorElegido ? "selected" : ""}>${c.etiqueta}</option>`).join("");
      return `<option value="" ${valorElegido ? "" : "selected"} disabled hidden>Elegir una categoría</option>${opciones}`;
    }

    // Igual que optsCategoriaNuevo, pero para el tipo de herramienta -- solo
    // se usa dentro de una fila de producto nuevo en Herramientas.
    function optsTipoHerramientaNuevo(valorElegido = "") {
      const opciones = TIPOS_HERRAMIENTA.map((t) =>
        `<option value="${t.valor}" ${t.valor === valorElegido ? "selected" : ""}>${t.etiqueta}</option>`).join("");
      return `<option value="" ${valorElegido ? "" : "selected"} disabled hidden>Elegir un tipo</option>${opciones}`;
    }

    // Consumibles y EPP son justamente lo que se controla por alerta de
    // stock bajo (a diferencia de herramientas/equipo) -- sin un mínimo
    // mayor que cero, "nivelStock()" nunca los marca como "bajo" y la
    // alerta nunca aparece, aunque se estén por acabar.
    const CATEGORIAS_CON_ALERTA = ["consumible", "epp"];
    function validarStockMinimo(categoria, stockMinimo) {
      if (CATEGORIAS_CON_ALERTA.includes(categoria) && !(Number(stockMinimo) > 0)) {
        throw new Error("indica un stock mínimo mayor que 0 para poder mostrar la alerta de stock bajo.");
      }
    }
    document.getElementById("stat-total-label").textContent = modoAlertas
      ? "En alerta"
      : TITULOS_PAGINA[categoriaPagina]?.[0] || "Tipos de material";

    // ── Estado y render ───────────────────────────────────────────────────
    // Catálogo completo tal cual llega de Firestore, sin filtrar todavía por
    // obra ni por modo -- se guarda para poder refiltrar al cambiar de obra
    // (ver recalcularMateriales) sin tener que esperar un nuevo snapshot.
    let materialesRaw = [];
    let materiales = [];
    // Catálogo completo sin filtrar por modo (materiales + EPP): solo para
    // saber a qué categoría pertenece un ítem esperado, sin mezclarlo en la
    // vista de esta página. Sí queda acotado a la obra activa.
    let materialesTodos = [];
    // Arriendos de herramientas pendientes por devolver -- se declara acá
    // (antes del primer render()) para que la tarjeta/filtro de
    // "Arrendadas" y el conteo puedan usarlo desde el principio; se llena
    // más abajo, junto con el resto del bloque de arriendos.
    let arriendos = [];
    const tbody = document.getElementById("tbody");
    const buscar = document.getElementById("buscar");
    const filtroCat = document.getElementById("filtro-categoria");
    const filtroTipoHerramienta = document.getElementById("filtro-tipo-herramienta");
    const filtroAdquisicionSel = document.getElementById("filtro-adquisicion");

    // Filtro por nivel de stock ('' | 'bajo' | 'cero'), activado al tocar
    // las tarjetas "Con stock bajo" / "Sin stock". Tocar la misma de nuevo
    // (o "Tipos de material") lo quita y vuelve a mostrar todo. En
    // Herramientas esas dos tarjetas no aplican (importa más si está
    // arrendada que si el stock está bajo) -- se reemplazan por
    // "Arrendadas".
    let filtroStock = "";
    // '' | 'comprada' | 'arrendada' -- se controla desde la tarjeta
    // "Arrendadas" (atajo) y desde el select del mismo nombre; ambos
    // quedan sincronizados entre sí.
    let filtroAdquisicion = "";
    const statTotalCard = document.getElementById("stat-total-card");
    const statBajoCard = document.getElementById("stat-bajo-card");
    const statCeroCard = document.getElementById("stat-cero-card");
    const statArrendadasCard = document.getElementById("stat-arrendadas-card");
    statBajoCard.classList.toggle("hidden", modoHerramienta);
    statCeroCard.classList.toggle("hidden", modoHerramienta);
    statArrendadasCard.classList.toggle("hidden", !modoHerramienta);
    function setFiltroStock(valor) {
      filtroStock = filtroStock === valor ? "" : valor;
      statTotalCard.classList.toggle("active", filtroStock === "");
      statBajoCard.classList.toggle("active", filtroStock === "bajo");
      statCeroCard.classList.toggle("active", filtroStock === "cero");
      render();
    }
    function setFiltroAdquisicion(valor) {
      filtroAdquisicion = valor;
      filtroAdquisicionSel.value = filtroAdquisicion;
      statArrendadasCard.classList.toggle("active", filtroAdquisicion === "arrendada");
      render();
    }
    statTotalCard.addEventListener("click", () => setFiltroStock(""));
    statBajoCard.addEventListener("click", () => setFiltroStock("bajo"));
    statCeroCard.addEventListener("click", () => setFiltroStock("cero"));
    statArrendadasCard.addEventListener("click", () => {
      setFiltroAdquisicion(filtroAdquisicion === "arrendada" ? "" : "arrendada");
    });
    filtroAdquisicionSel.addEventListener("change", () => setFiltroAdquisicion(filtroAdquisicionSel.value));
    filtroTipoHerramienta.addEventListener("change", render);

    const fmtNum = (n) => (Number(n) || 0).toLocaleString("es-CL", { maximumFractionDigits: 3 });
    const fmtFecha = (ts) => {
      const d = ts?.toDate?.();
      if (!d) return "—";
      return d.toLocaleDateString("es-CL") + " " +
        d.toLocaleTimeString("es-CL", { hour: "2-digit", minute: "2-digit" });
    };
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

    // Sin tildes/mayúsculas, para comparar nombres de forma más flexible.
    const normalizar = (s) => String(s || "").trim().toLowerCase()
      .normalize("NFD").replace(/[̀-ͯ]/g, "");

    /**
     * Deshabilita "Quitar"/"+ Agregar..." mientras se envía un registro con
     * varios productos (Material entrante/saliente): sin esto, quitar una
     * fila a mitad del envío reordena el DOM que el bucle de registro
     * todavía está recorriendo -- la siguiente vuelta busca una fila que ya
     * no existe y truena con un error crudo en vez de fallar con aviso.
     */
    function alternarBotonesLista(contenedores, bloqueado) {
      contenedores.forEach((cont) => cont?.querySelectorAll("button").forEach((b) => { b.disabled = bloqueado; }));
    }

    /**
     * Buscador de Pedido de Materiales (PM), por N.º de pedido o
     * solicitante -- para saber qué pedido trajo esta guía/factura.
     */
    function crearBuscadorPedido(prefijo, { onSeleccionar } = {}) {
      const input = document.getElementById(`${prefijo}-buscar`);
      const oculto = document.getElementById(prefijo);
      const lista = document.getElementById(`${prefijo}-lista`);

      function render() {
        const q = normalizar(input.value);
        const items = pedidos
          .filter((p) => esDeObraActiva(p.obra))
          .filter((p) => !q || [p.numero, p.solicitante].some((v) => normalizar(v).includes(q)))
          .slice(0, 30);
        lista.innerHTML = items.length
          ? items.map((p) => `
              <button type="button" class="btn btn-ghost btn-xs" data-id="${p.id}">
                ${esc(p.numero) || "(sin folio)"} ${p.solicitante ? `— ${esc(p.solicitante)}` : ""}
              </button>`).join("")
          : `<div class="text-sm muted empty">Sin resultados.</div>`;
        lista.classList.remove("hidden");
      }

      input.addEventListener("focus", render);
      input.addEventListener("input", () => { oculto.value = ""; onSeleccionar?.(null); render(); });
      input.addEventListener("keydown", (e) => { if (e.key === "Escape") lista.classList.add("hidden"); });
      lista.addEventListener("click", (e) => {
        const btn = e.target.closest("[data-id]");
        if (!btn) return;
        const p = pedidos.find((x) => x.id === btn.getAttribute("data-id"));
        oculto.value = p?.id || "";
        input.value = p ? `${p.numero || "(sin folio)"}${p.solicitante ? " — " + p.solicitante : ""}` : "";
        lista.classList.add("hidden");
        onSeleccionar?.(p || null);
      });
      document.addEventListener("click", (e) => {
        if (e.target !== input && !lista.contains(e.target)) lista.classList.add("hidden");
      });

      return {
        reset() { input.value = ""; oculto.value = ""; lista.classList.add("hidden"); lista.innerHTML = ""; },
      };
    }

    function render() {
      const q = buscar.value.trim().toLowerCase();
      const cat = filtroCat.value;
      // Ids de productos con al menos un arriendo aún pendiente por
      // devolver -- solo se usa (y solo se calcula lo pendiente) en
      // Herramientas. Acotado a la obra activa, igual que el resto.
      const idsArrendadas = new Set(arriendos.filter((a) => !a.devuelto && esDeObraActiva(a.obra)).map((a) => a.materialId));
      const vista = materiales.filter((m) =>
        (!cat || m.categoria === cat) &&
        (!filtroStock || nivelStock(m) === filtroStock) &&
        (!filtroTipoHerramienta.value || m.tipoHerramienta === filtroTipoHerramienta.value) &&
        (!filtroAdquisicion || (filtroAdquisicion === "arrendada") === idsArrendadas.has(m.id)) &&
        (!q || (m.producto || "").toLowerCase().includes(q)));

      // Estadísticas (sobre todo el inventario, no la vista filtrada)
      const bajos = materiales.filter((m) => nivelStock(m) === "bajo");
      const ceros = materiales.filter((m) => nivelStock(m) === "cero");
      document.getElementById("stat-total").textContent = materiales.length;
      document.getElementById("stat-bajo").textContent = bajos.length;
      document.getElementById("stat-cero").textContent = ceros.length;
      if (modoHerramienta) document.getElementById("stat-arrendadas").textContent = idsArrendadas.size;

      const alerta = document.getElementById("alerta-stock");
      const enAlerta = [...ceros, ...bajos];
      if (enAlerta.length) {
        alerta.classList.remove("hidden");
        alerta.textContent = "Atención: " + enAlerta
          .map((m) => `${m.producto} (${fmtNum(m.stock)} ${m.unidad})`)
          .join(" · ");
      } else {
        alerta.classList.add("hidden");
      }

      if (!vista.length) {
        tbody.innerHTML = `<tr><td colspan="9" class="empty">${
          materiales.length ? "Sin resultados para el filtro." : "Aún no hay materiales cargados."
        }</td></tr>`;
        return;
      }

      tbody.innerHTML = vista.map((m) => {
        const nivel = nivelStock(m);
        const clase = { ok: "stock-ok", bajo: "stock-bajo", cero: "stock-cero" }[nivel];
        return `
          <tr>
            <td>
              <div>${esc(m.producto)}</div>
              ${m.descripcion ? `<div class="text-sm muted">${esc(m.descripcion)}</div>` : ""}
              ${m.sinReposicion ? `<div class="text-sm muted">No se repone</div>` : ""}
            </td>
            <td><span class="badge badge-muted">${esc(etiquetaCategoria(m.categoria))}</span></td>
            <td class="${modoHerramienta ? "" : "hidden"}">${m.tipoHerramienta ? esc(etiquetaTipoHerramienta(m.tipoHerramienta)) : "<span class='muted'>—</span>"}</td>
            <td class="${modoHerramienta ? "" : "hidden"}">${idsArrendadas.has(m.id) ? `<span class="badge badge-muted">Arrendada</span>` : `<span class="badge badge-muted">Comprada</span>`}</td>
            <td>${esc(m.medida) || "<span class='muted'>—</span>"}</td>
            <td>${esc(m.centroGestion) || "<span class='muted'>—</span>"}</td>
            <td>${esc(m.centroCosto) || "<span class='muted'>—</span>"}</td>
            <td class="text-right nowrap">
              <span class="stock-num ${clase}">${fmtNum(m.stock)}</span>
              <span class="muted text-sm">${esc(m.unidad)}</span>
              ${m.stockMinimo ? `<div class="text-sm muted">mín. ${fmtNum(m.stockMinimo)}</div>` : ""}
            </td>
            <td>${esc(m.ubicacion) || "<span class='muted'>—</span>"}</td>
            <td class="nowrap text-sm muted">${fmtFecha(m.actualizadoEn)}</td>
            <td class="only-bodega nowrap">
              <div class="row-actions" style="justify-content:flex-end; flex-wrap:nowrap;">
                ${!m.sinReposicion && (Number(m.stock) || 0) <= 0
                  ? `<button class="btn btn-ghost btn-xs" data-sin-reposicion="${m.id}">No reponer</button>`
                  : ""}
                <button class="btn btn-ghost btn-xs btn-danger" data-eliminar="${m.id}">Eliminar</button>
              </div>
            </td>
          </tr>`;
      }).join("");
    }

    buscar.addEventListener("input", render);
    filtroCat.addEventListener("change", render);

    // Recalcula materialesTodos/materiales desde materialesRaw, acotando
    // primero a la obra activa (para no mezclar catálogo ni permitir que
    // una entrada quede sumada al producto de la otra obra) y después al
    // modo de esta página (categoría / alertas), igual que antes.
    function recalcularMateriales() {
      const items = materialesRaw.filter((m) => esDeObraActiva(m.obra));
      materialesTodos = items;
      materiales = modoAlertas
        ? items.filter((m) => nivelStock(m) !== "ok")
        : items.filter((m) => categoriaPagina ? m.categoria === categoriaPagina : !["epp", "herramienta"].includes(m.categoria));
      render();
    }

    escucharMateriales(
      (items) => {
        materialesRaw = items;
        recalcularMateriales();
      },
      (err) => {
        tbody.innerHTML = `<tr><td colspan="9" class="empty">Error al cargar: ${esc(err.message)}</td></tr>`;
      },
    );
    escucharObraActiva(recalcularMateriales);

    // Pedidos de materiales (PM) y sus órdenes de compra (Seguimiento de
    // compra): para poder asociar un "Material entrante" a la orden que lo
    // trajo, y para el buscador de "qué debería estar llegando".
    let pedidos = [];
    let ordenesCompra = [];
    escucharPedidos((items) => { pedidos = items; }, () => {});
    escucharOrdenes((items) => { ordenesCompra = items; }, () => {});

    // Fletes: para poder vincular un "Material entrante" al traslado (y su
    // factura) que lo trajo. Se crean en la página Fletes, acá solo se eligen.
    let fletes = [];
    escucharFletes((items) => { fletes = items; }, () => {});

    // Arriendos de herramientas: solo importa en esta página (Herramientas)
    // -- ahí se muestra la lista de lo que sigue pendiente por devolver.
    // (el arreglo "arriendos" ya se declaró más arriba, junto al resto del
    // estado, para que la tarjeta "Arrendadas" lo pueda usar desde el
    // primer render()).
    const bloqueArriendos = document.getElementById("bloque-arriendos");
    const resumenArriendos = document.getElementById("resumen-arriendos");
    const listaArriendos = document.getElementById("lista-arriendos");
    function renderArriendos() {
      if (!modoHerramienta) return;
      const pendientes = arriendos.filter((a) => !a.devuelto && esDeObraActiva(a.obra));
      bloqueArriendos.classList.toggle("hidden", !pendientes.length);
      resumenArriendos.textContent = `${pendientes.length} herramienta${pendientes.length === 1 ? "" : "s"} arrendada${pendientes.length === 1 ? "" : "s"} por devolver`;
      listaArriendos.innerHTML = pendientes.map((a) => `
        <div class="item-pedido-fila" data-arriendo-id="${a.id}">
          <div style="display:flex; justify-content:space-between; align-items:baseline; gap:8px; flex-wrap:wrap;">
            <div>
              <strong>${esc(a.materialProducto)}</strong>
              <span class="muted text-sm"> — ${fmtNum(a.cantidad)} unidad${a.cantidad === 1 ? "" : "es"} · ${esc(a.empresa)}</span>
            </div>
            <button type="button" class="btn btn-ghost btn-xs only-bodega" data-devolver="${a.id}">Marcar devuelta</button>
          </div>
        </div>`).join("");
    }
    escucharArriendos((items) => { arriendos = items; renderArriendos(); render(); }, () => {});
    escucharObraActiva(renderArriendos);
    listaArriendos.addEventListener("click", async (e) => {
      const id = e.target.getAttribute?.("data-devolver");
      if (!id) return;
      const a = arriendos.find((x) => x.id === id);
      if (!a) return;
      if (!confirm(`¿Marcar "${a.materialProducto}" (${fmtNum(a.cantidad)} unidad${a.cantidad === 1 ? "" : "es"}) como devuelta a ${a.empresa}? Se descuenta del stock.`)) return;
      try {
        await devolverHerramienta(a);
        flash("Herramienta marcada como devuelta.");
      } catch (err) {
        flash(err.message, "error");
      }
    });

    /**
     * Ítems pendientes (de órdenes de compra aún no recibidas), con los
     * datos del ítem original del pedido (unidad, centro de gestión/costo)
     * para poder precargarlos si hay que crear el producto de cero.
     */
    /** Ítems de una orden de compra puntual (para el buscador "Ítem de esta orden"). */
    function itemsDePedido(pedidoId) {
      const pedido = pedidos.find((p) => p.id === pedidoId);
      if (!pedido) return [];
      return (pedido.items || [])
        // El pedido no dice a qué sección pertenece cada ítem. Si ya existe
        // como producto, se sabe por su categoría real y se muestra solo en
        // la página que le corresponde (para no mezclar Materiales, EPP y
        // Herramientas); si no existe todavía, es ambiguo y se deja ver en
        // las tres -- al crearlo, la categoría la fija esta misma página.
        .filter((it) => {
          if (modoAlertas) return true;
          const existente = materialesTodos.find((m) => normalizar(m.producto) === normalizar(it.glosa));
          if (!existente) return true;
          return categoriaPagina
            ? existente.categoria === categoriaPagina
            : !["epp", "herramienta"].includes(existente.categoria);
        })
        // Lo que ya llegó completo no hace falta seguir ofreciéndolo acá; y
        // si llegó solo una parte (p. ej. pidieron 2 y ya hay 1 en stock),
        // se descuenta esa parte para que la cantidad a registrar por
        // defecto sea la que realmente falta, no la pedida original.
        .map((it) => {
          const recibido = cantidadRecibidaDe(ordenesCompra, pedidoId, it.id);
          const pendiente = Math.max((Number(it.cantidad) || 0) - recibido, 0);
          return { ...it, recibido, pendiente };
        })
        .filter((it) => it.pendiente > 0);
    }

    // ── Eliminar material ───────────────────────────────────────────────
    tbody.addEventListener("click", async (e) => {
      const idEliminar = e.target.getAttribute?.("data-eliminar");
      const idSinReposicion = e.target.getAttribute?.("data-sin-reposicion");

      if (idEliminar) {
        const m = materiales.find((x) => x.id === idEliminar);
        if (!m) return;
        const ok = confirm(
          `¿Eliminar "${m.producto}"? Se borra la ficha del catálogo (stock actual: ${fmtNum(m.stock)} ${m.unidad}). El historial de movimientos no se borra. Esta acción no se puede deshacer.`,
        );
        if (!ok) return;
        try {
          await eliminarMaterial(idEliminar);
          flash("Material eliminado.");
        } catch (err) {
          flash(err.message, "error");
        }
        return;
      }

      if (idSinReposicion) {
        try {
          await marcarSinReposicion(idSinReposicion, true);
          flash("Producto marcado como 'no se repone': ya no cuenta como alerta de stock.");
        } catch (err) {
          flash(err.message, "error");
        }
      }
    });

    // ── Modales: apertura/cierre comunes ────────────────────────────────
    document.querySelectorAll("dialog [data-close]").forEach((b) =>
      b.addEventListener("click", () => b.closest("dialog").close()));

    // ── Material entrante ───────────────────────────────────────────────
    const dlgEntrante = document.getElementById("dlg-entrante");
    const formEntrante = document.getElementById("form-entrante");
    const errEntrante = document.getElementById("err-entrante");

    const bloqueProductoManual = document.getElementById("bloque-producto-manual");
    const bloqueItemsPedido = document.getElementById("bloque-items-pedido");
    const eUbicacion = document.getElementById("e-ubicacion");

    // Sin Pedido de Materiales (PM) elegido: uno o varios productos a la
    // vez, cada uno en su propia fila -- cada fila tiene su propio
    // buscador (si lo que se escribe calza exacto con uno que ya existe,
    // es ese; si no, se completan solos los campos para crearlo, cubriendo
    // la excepción sin PM de por medio: caja chica, casa matriz...).
    let itemsManualSeleccionados = []; // [{id}] -- los demás valores viven en el DOM de cada fila, ver sincronizarItemsManualDesdeDom
    const itemsManualCont = document.getElementById("items-manual-lista");

    function nuevaFilaManual() {
      return { id: crypto.randomUUID(), abierto: true };
    }

    // Antes de redibujar (agregar/quitar una fila) hay que guardar lo que
    // ya se había escrito en cada una -- si no, el redibujo las deja en
    // blanco de nuevo. Como estos campos no llevan estado propio en JS
    // (se leen del DOM cuando hace falta), acá se copian a un dataset en
    // el propio objeto de la fila para poder reconstruir su HTML.
    function sincronizarItemsManualDesdeDom() {
      itemsManualSeleccionados.forEach((item) => {
        const fila = itemsManualCont.querySelector(`.item-manual-fila[data-row-id="${item.id}"]`);
        if (!fila) return;
        item.textoBuscador = fila.querySelector(".im-buscar").value;
        item.materialId = fila.querySelector(".im-producto").value;
        item.nuevoProducto = fila.querySelector(".im-nuevo-producto").value;
        item.cantidad = fila.querySelector(".im-cantidad").value;
        item.categoria = fila.querySelector(".im-categoria")?.value || "";
        item.unidad = fila.querySelector(".im-unidad")?.value || "";
        item.medida = fila.querySelector(".im-medida")?.value || "";
        item.centroGestion = fila.querySelector(".im-centro-gestion")?.value || "";
        item.centroCosto = fila.querySelector(".im-centro-costo")?.value || "";
        item.stockMinimo = fila.querySelector(".im-minimo")?.value ?? 0;
        item.descripcion = fila.querySelector(".im-descripcion")?.value || "";
        item.tipoHerramienta = fila.querySelector(".im-tipo-herramienta")?.value || "";
        // El desplegable se puede abrir/cerrar a mano (clic en el
        // resumen), sin pasar por ningún botón nuestro -- se respeta lo
        // que haya quedado en vez de forzarlo a abierto/cerrado.
        item.abierto = fila.open;
      });
    }

    function renderItemsManual() {
      itemsManualCont.innerHTML = itemsManualSeleccionados.map((item) => {
        const existente = item.materialId ? materiales.find((m) => m.id === item.materialId) : null;
        const hayTexto = !!(item.textoBuscador || "").trim();
        // Un desplegable por producto (no un <div> siempre expandido):
        // así, a medida que se agregan varios, los que ya se llenaron se
        // ven como una lista compacta en vez de alargar la ficha entera.
        // Al menos uno queda abierto siempre (el que se está llenando).
        return `
          <details class="item-pedido-fila item-manual-fila lista-desplegable" data-row-id="${item.id}" ${item.abierto ? "open" : ""}>
            <summary style="display:flex; justify-content:space-between; gap:10px;">
              <span class="im-resumen">Producto nuevo</span>
              ${itemsManualSeleccionados.length > 1 ? `<button type="button" class="btn btn-ghost btn-xs btn-danger im-quitar">Quitar</button>` : ""}
            </summary>
            <div class="field" style="position:relative; margin-top:10px;">
              <label>Producto</label>
              <input type="text" class="im-buscar buscador-input" placeholder="Busca o escribe el nombre del producto…" autocomplete="off" value="${esc(item.textoBuscador || "")}" />
              <input type="hidden" class="im-producto" value="${esc(item.materialId || "")}" />
              <input type="hidden" class="im-nuevo-producto" value="${esc(item.nuevoProducto || "")}" />
              <div class="im-lista buscador-lista hidden"></div>
            </div>
            <p class="text-sm muted im-stock" style="margin-top:-8px; margin-bottom:10px;">${existente ? `Stock actual: ${fmtNum(existente.stock)} ${esc(existente.unidad)}` : ""}</p>
            <div class="im-nuevo ${!existente && hayTexto ? "" : "hidden"}">
              <div class="row">
                <div class="field">
                  <label>Categoría</label>
                  <select class="im-categoria">${optsCategoriaNuevo(item.categoria)}</select>
                </div>
                <div class="field">
                  <label>Unidad</label>
                  <input type="text" class="im-unidad" maxlength="20" placeholder="piezas, unidades, m, kg…" value="${esc(item.unidad || "")}" />
                </div>
              </div>
              <div class="field im-campo-tipo-herramienta ${modoHerramienta ? "" : "hidden"}">
                <label>Tipo de herramienta</label>
                <select class="im-tipo-herramienta">${optsTipoHerramientaNuevo(item.tipoHerramienta)}</select>
              </div>
              <div class="field">
                <label>Medida <span class="muted">(opcional)</span></label>
                <input type="text" class="im-medida" maxlength="40" placeholder="Ej: 1/2 pulgada, 25 kg…" value="${esc(item.medida || "")}" />
              </div>
              <div class="row">
                <div class="field">
                  <label>Centro de gestión <span class="muted">(opcional)</span></label>
                  <input type="text" class="im-centro-gestion" maxlength="60" value="${esc(item.centroGestion || "")}" />
                </div>
                <div class="field">
                  <label>Centro de costo <span class="muted">(opcional)</span></label>
                  <input type="text" class="im-centro-costo" maxlength="60" value="${esc(item.centroCosto || "")}" />
                </div>
              </div>
              <div class="field">
                <label>Stock mínimo (alerta) <span class="muted">— obligatorio en Consumibles y EPP</span></label>
                <input type="number" class="im-minimo" min="0" step="any" value="${item.stockMinimo ?? 0}" />
              </div>
              <div class="field">
                <label>Descripción <span class="muted">(opcional)</span></label>
                <textarea class="im-descripcion" rows="2" maxlength="300">${esc(item.descripcion || "")}</textarea>
              </div>
            </div>
            <div class="row" style="margin-top:10px;">
              <div class="field">
                <label>Cantidad recibida</label>
                <input type="number" class="im-cantidad" min="0" step="any" value="${esc(item.cantidad || "")}" />
              </div>
            </div>
          </details>`;
      }).join("");

      itemsManualCont.querySelectorAll(".item-manual-fila").forEach((fila) => {
        const item = itemsManualSeleccionados.find((x) => x.id === fila.getAttribute("data-row-id"));
        wireFilaManual(fila, item);
        actualizarResumenFila(fila);
      });
    }

    /** Texto corto del <summary> de una fila (producto + cantidad), leído directo del DOM -- se llama tras cada cambio relevante, sin esperar a un redibujo completo. */
    function actualizarResumenFila(fila) {
      const resumen = fila.querySelector(".im-resumen");
      const materialId = fila.querySelector(".im-producto").value;
      const nuevoProducto = fila.querySelector(".im-nuevo-producto").value;
      const cantidad = fila.querySelector(".im-cantidad").value;
      const existente = materialId ? materiales.find((m) => m.id === materialId) : null;
      const nombre = existente ? existente.producto : nuevoProducto;
      if (!nombre) { resumen.textContent = "Producto nuevo"; return; }
      const unidad = existente ? existente.unidad : (fila.querySelector(".im-unidad")?.value || "");
      resumen.textContent = `${nombre}${cantidad ? ` — ${fmtNum(cantidad)}${unidad ? " " + unidad : ""}` : ""}`;
    }

    /** Cablea el buscador de producto y el botón "Quitar" de UNA fila recién insertada en el DOM. */
    function wireFilaManual(fila, item) {
      const input = fila.querySelector(".im-buscar");
      const oculto = fila.querySelector(".im-producto");
      const nuevoOculto = fila.querySelector(".im-nuevo-producto");
      const lista = fila.querySelector(".im-lista");
      const stockTxt = fila.querySelector(".im-stock");
      const bloqueNuevo = fila.querySelector(".im-nuevo");

      function renderLista() {
        const q = normalizar(input.value);
        const items = [...materiales]
          .filter((m) => !q || normalizar(m.producto).includes(q))
          .sort((a, b) => (a.producto || "").localeCompare(b.producto || "", "es", { sensitivity: "base" }))
          .slice(0, 30);
        lista.innerHTML = items.length
          ? items.map((m) => `
              <button type="button" class="btn btn-ghost btn-xs" data-id="${m.id}">
                ${esc(m.producto)} — stock ${fmtNum(m.stock)} ${esc(m.unidad)}
              </button>`).join("")
          : `<div class="text-sm muted empty">Sin resultados.</div>`;
        lista.classList.remove("hidden");
      }

      function elegir(m) {
        input.value = m ? m.producto : input.value;
        oculto.value = m?.id || "";
        nuevoOculto.value = m ? "" : (input.value.trim().length >= 2 ? input.value.trim() : "");
        stockTxt.textContent = m ? `Stock actual: ${fmtNum(m.stock)} ${m.unidad}` : "";
        bloqueNuevo.classList.toggle("hidden", !!m || !nuevoOculto.value);
        lista.classList.add("hidden");
        actualizarResumenFila(fila);
      }

      input.addEventListener("focus", renderLista);
      input.addEventListener("input", () => {
        const texto = input.value.trim();
        const existente = materiales.find((m) => normalizar(m.producto) === normalizar(texto));
        elegir(existente || null);
        renderLista();
      });
      input.addEventListener("keydown", (e) => { if (e.key === "Escape") lista.classList.add("hidden"); });
      lista.addEventListener("click", (e) => {
        const btn = e.target.closest("[data-id]");
        if (!btn) return;
        elegir(materiales.find((x) => x.id === btn.getAttribute("data-id")));
      });
      fila.querySelector(".im-cantidad").addEventListener("input", () => actualizarResumenFila(fila));
      fila.querySelector(".im-unidad")?.addEventListener("input", () => actualizarResumenFila(fila));

      fila.querySelector(".im-quitar")?.addEventListener("click", (e) => {
        // El botón vive dentro de <summary>: sin esto, el clic también
        // abre/cierra el desplegable (o lo deja cerrado justo al quitar
        // el que tocaba, por el toggle nativo del clic).
        e.preventDefault();
        e.stopPropagation();
        sincronizarItemsManualDesdeDom();
        itemsManualSeleccionados = itemsManualSeleccionados.filter((x) => x.id !== item.id);
        renderItemsManual();
      });
    }

    // Un solo listener delegado (no uno por fila: las filas se recrean
    // cada vez que se agrega/quita una, así que uno por fila iría
    // acumulando listeners repetidos sobre `document`) para cerrar el
    // desplegable de resultados si se hace clic afuera.
    document.addEventListener("click", (e) => {
      itemsManualCont.querySelectorAll(".item-manual-fila").forEach((fila) => {
        const input = fila.querySelector(".im-buscar");
        const lista = fila.querySelector(".im-lista");
        if (e.target !== input && !lista.contains(e.target)) lista.classList.add("hidden");
      });
    });

    document.getElementById("btn-agregar-producto-manual").addEventListener("click", () => {
      sincronizarItemsManualDesdeDom();
      // Las filas anteriores se colapsan (solo la nueva queda abierta) --
      // si no, con varios productos la ficha se vuelve interminable de
      // scrollear. Igual se pueden volver a abrir con un clic.
      itemsManualSeleccionados.forEach((item) => { item.abierto = false; });
      itemsManualSeleccionados.push(nuevaFilaManual());
      renderItemsManual();
    });

    // Con un PM elegido: uno o varios productos de ese pedido a la vez,
    // cada uno con su propia cantidad -- se eligen en el diálogo
    // "Elegir productos" (selección múltiple) y quedan en esta lista.
    // Si alguno no existe todavía como producto, se completa solo para
    // crearlo (unidad/centro de gestión/costo vienen del propio PM).
    let itemsPMSeleccionados = []; // [{id, glosa, cantidad, unidad, centroGestion, centroCosto, existenteId, categoriaElegida}]
    const itemsPedidoElegidosCont = document.getElementById("items-pedido-elegidos");
    const btnElegirItems = document.getElementById("btn-elegir-items");

    // Antes de redibujar las filas (p. ej. tras un error al registrar) hay
    // que guardar lo que ya se había escrito/elegido en cada una -- si no,
    // el redibujo las deja en blanco de nuevo (cantidad, unidad y sobre
    // todo la categoría, que además vuelve a pedirse como si nunca se
    // hubiera elegido).
    function sincronizarItemsDesdeDom() {
      itemsPMSeleccionados.forEach((item) => {
        const fila = itemsPedidoElegidosCont.querySelector(`.item-pedido-fila[data-item-id="${item.id}"]`);
        if (!fila) return;
        const cantidadInput = fila.querySelector(".ie-cantidad");
        if (cantidadInput) item.cantidad = cantidadInput.value;
        const unidadInput = fila.querySelector(".ie-unidad");
        if (unidadInput) item.unidad = unidadInput.value;
        const categoriaSelect = fila.querySelector(".ie-categoria");
        if (categoriaSelect) item.categoriaElegida = categoriaSelect.value;
        const minimoInput = fila.querySelector(".ie-minimo");
        if (minimoInput) item.stockMinimo = minimoInput.value;
        const observacionInput = fila.querySelector(".ie-observacion");
        if (observacionInput) item.observacionRecepcion = observacionInput.value;
      });
    }

    function renderItemsPedidoElegidos() {
      btnElegirItems.textContent = itemsPMSeleccionados.length
        ? `${itemsPMSeleccionados.length} producto${itemsPMSeleccionados.length === 1 ? "" : "s"} elegido${itemsPMSeleccionados.length === 1 ? "" : "s"} — cambiar`
        : "Elegir productos…";
      if (!itemsPMSeleccionados.length) {
        itemsPedidoElegidosCont.innerHTML = "";
        return;
      }
      itemsPedidoElegidosCont.innerHTML = itemsPMSeleccionados.map((item) => {
        const existente = item.existenteId ? materialesTodos.find((m) => m.id === item.existenteId) : null;
        return `
          <div class="item-pedido-fila" data-item-id="${item.id}">
            <div style="display:flex; justify-content:space-between; align-items:baseline; gap:8px;">
              <strong>${esc(item.glosa)}</strong>
              ${existente
                ? `<span class="text-sm muted">Stock actual: ${fmtNum(existente.stock)} ${esc(existente.unidad)}</span>`
                : `<span class="badge badge-warn text-sm">Producto nuevo</span>`}
            </div>
            <div class="row" style="margin-top:8px;">
              <div class="field">
                <label>Cantidad recibida</label>
                <input type="number" class="ie-cantidad" min="0" step="any" value="${item.cantidad}" />
              </div>
              ${!existente ? `
              <div class="field">
                <label>Unidad</label>
                <input type="text" class="ie-unidad" maxlength="20" value="${esc(item.unidad)}" />
              </div>` : ""}
            </div>
            ${!existente ? `
            <div class="row" style="margin-top:10px;">
              <div class="field">
                <label>Categoría</label>
                <select class="ie-categoria">${optsCategoriaNuevo(item.categoriaElegida)}</select>
              </div>
              <div class="field">
                <label>Stock mínimo (alerta) <span class="muted">— obligatorio en Consumibles y EPP</span></label>
                <input type="number" class="ie-minimo" min="0" step="any" value="${item.stockMinimo ?? 0}" />
              </div>
            </div>` : ""}
            <div class="field" style="margin-top:10px;">
              <label>Observación de recepción <span class="muted">(si llegó distinto a lo pedido)</span></label>
              <textarea class="ie-observacion" rows="2" maxlength="200" placeholder="Ej: llegaron 8 de 10, los otros 2 vienen después">${esc(item.observacionRecepcion || "")}</textarea>
            </div>
          </div>`;
      }).join("");
    }

    const dlgElegirItems = document.getElementById("dlg-elegir-items");
    const elegirItemsBuscar = document.getElementById("elegir-items-buscar");
    const elegirItemsLista = document.getElementById("elegir-items-lista");
    const elegirItemsContador = document.getElementById("elegir-items-contador");
    let seleccionTemporal = new Set();

    function pedidoElegidoId() { return document.getElementById("e-pedido").value; }

    function renderElegirItemsLista() {
      const q = normalizar(elegirItemsBuscar.value);
      const items = itemsDePedido(pedidoElegidoId())
        .filter((it) => !q || normalizar(it.glosa).includes(q))
        .sort((a, b) => (a.glosa || "").localeCompare(b.glosa || "", "es", { sensitivity: "base" }));
      elegirItemsLista.innerHTML = items.length
        ? items.map((it) => `
            <label class="chk-row">
              <input type="checkbox" data-item-id="${it.id}" ${seleccionTemporal.has(it.id) ? "checked" : ""} />
              <span>${esc(it.glosa)} <span class="muted text-sm">— ${it.recibido > 0
                ? `faltan ${fmtNum(it.pendiente)} de ${fmtNum(it.cantidad)} ${esc(it.unidad)}`
                : `pedido ${fmtNum(it.cantidad)} ${esc(it.unidad)}`}</span></span>
            </label>`).join("")
        : `<div class="text-sm muted empty">Sin resultados.</div>`;
      actualizarContadorElegirItems();
    }

    function actualizarContadorElegirItems() {
      const total = itemsDePedido(pedidoElegidoId()).length;
      elegirItemsContador.textContent = `${seleccionTemporal.size} de ${total}`;
    }

    elegirItemsBuscar.addEventListener("input", renderElegirItemsLista);
    elegirItemsLista.addEventListener("change", (e) => {
      const chk = e.target.closest("input[type=checkbox]");
      if (!chk) return;
      const id = chk.getAttribute("data-item-id");
      if (chk.checked) seleccionTemporal.add(id); else seleccionTemporal.delete(id);
      actualizarContadorElegirItems();
    });
    document.getElementById("btn-elegir-items-todos").addEventListener("click", () => {
      itemsDePedido(pedidoElegidoId()).forEach((it) => seleccionTemporal.add(it.id));
      renderElegirItemsLista();
    });
    document.getElementById("btn-elegir-items-limpiar").addEventListener("click", () => {
      seleccionTemporal.clear();
      renderElegirItemsLista();
    });
    btnElegirItems.addEventListener("click", () => {
      seleccionTemporal = new Set(itemsPMSeleccionados.map((x) => x.id));
      elegirItemsBuscar.value = "";
      renderElegirItemsLista();
      dlgElegirItems.showModal();
    });
    document.getElementById("btn-elegir-items-cancelar").addEventListener("click", () => dlgElegirItems.close());
    document.getElementById("btn-elegir-items-cerrar").addEventListener("click", () => dlgElegirItems.close());
    document.getElementById("btn-elegir-items-listo").addEventListener("click", () => {
      const disponibles = itemsDePedido(pedidoElegidoId());
      const anteriores = new Map(itemsPMSeleccionados.map((x) => [x.id, x]));
      itemsPMSeleccionados = disponibles
        .filter((it) => seleccionTemporal.has(it.id))
        .map((it) => {
          const previo = anteriores.get(it.id);
          if (previo) return previo; // conserva cantidad/categoría ya editadas
          const existente = materialesTodos.find((m) => normalizar(m.producto) === normalizar(it.glosa));
          return {
            // La cantidad por defecto es lo que TODAVÍA falta (pedido menos
            // lo ya recibido en otras entradas), no el total pedido -- así
            // no se vuelve a contar como recibido algo que ya está en
            // stock.
            id: it.id, glosa: it.glosa, cantidad: it.pendiente, unidad: it.unidad,
            centroGestion: it.centroGestion, centroCosto: it.centroCosto,
            existenteId: existente ? existente.id : null,
          };
        });
      dlgElegirItems.close();
      renderItemsPedidoElegidos();
    });

    const buscadorPedidoEntrante = crearBuscadorPedido("e-pedido", {
      onSeleccionar: (p) => {
        itemsPMSeleccionados = [];
        renderItemsPedidoElegidos();
        itemsManualSeleccionados = [nuevaFilaManual()];
        renderItemsManual();
        actualizarVistaEntrante();
      },
    });

    // ── Fotos de la factura/guía (opcional, pueden ser varias): dos
    // botones, "Tomar foto" y "Elegir archivo", cada uno con su propia
    // entrada de archivo oculta -- separados porque mezclar
    // accept="image/*,.pdf" con capture="environment" en un solo campo
    // hace que en varios celulares ya no salte la cámara sola. Cada vez
    // que se elige algo (con cualquiera de los dos) se AGREGA a la lista,
    // no la reemplaza -- "Tomar foto" de a una (la cámara nativa no deja
    // elegir varias), "Elegir archivo" permite varias de una vez.
    const eFacturaCamara = document.getElementById("e-factura");
    const eFacturaArchivo = document.getElementById("e-factura-archivo");
    const eFacturaElegida = document.getElementById("e-factura-elegida");
    let facturasElegidasEntrante = [];

    function renderFacturasElegidas() {
      eFacturaElegida.innerHTML = facturasElegidasEntrante.map((archivo, i) => `
        <span class="badge badge-muted" style="display:inline-flex; align-items:center; gap:6px; margin:2px 6px 2px 0;">
          📎 ${esc(archivo.name)}
          <button type="button" class="btn-quitar-factura" data-idx="${i}" aria-label="Quitar" style="border:none; background:none; cursor:pointer; font-weight:700; line-height:1; padding:0;">×</button>
        </span>`).join("");
    }
    function agregarFacturasEntrante(archivos) {
      facturasElegidasEntrante.push(...[...archivos].filter(Boolean));
      renderFacturasElegidas();
    }
    eFacturaElegida.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-idx]");
      if (!btn) return;
      facturasElegidasEntrante.splice(Number(btn.getAttribute("data-idx")), 1);
      renderFacturasElegidas();
    });
    // Se limpia el valor del <input> tras leerlo: si no, elegir DE NUEVO el
    // mismo archivo (p. ej. sacar la misma foto dos veces) no dispara
    // "change" la segunda vez, porque el navegador ve el mismo valor.
    eFacturaCamara.addEventListener("change", () => {
      agregarFacturasEntrante(eFacturaCamara.files);
      eFacturaCamara.value = "";
    });
    eFacturaArchivo.addEventListener("change", () => {
      agregarFacturasEntrante(eFacturaArchivo.files);
      eFacturaArchivo.value = "";
    });
    document.getElementById("btn-e-factura-camara").addEventListener("click", () => eFacturaCamara.click());
    document.getElementById("btn-e-factura-archivo").addEventListener("click", () => eFacturaArchivo.click());

    // ── Flete asociado (opcional): buscador simple, igual patrón que el
    // de Pedido de Materiales -- se crea/edita aparte, en Fletes. ─────────
    const eFleteBuscar = document.getElementById("e-flete-buscar");
    const eFleteHidden = document.getElementById("e-flete");
    const eFleteLista = document.getElementById("e-flete-lista");

    function renderFleteLista() {
      const q = normalizar(eFleteBuscar.value);
      const items = fletes
        .filter((f) => esDeObraActiva(f.obra))
        .filter((f) => !q || normalizar(f.empresa).includes(q))
        .slice(0, 20);
      eFleteLista.innerHTML = items.length
        ? items.map((f) => `
            <button type="button" class="btn btn-ghost btn-xs" data-id="${f.id}">
              ${esc(f.empresa)} <span class="muted text-sm">— ${esc(etiquetaTipoFlete(f.tipo))}</span>
            </button>`).join("")
        : `<div class="text-sm muted empty">Sin resultados. Créalo en Fletes.</div>`;
      eFleteLista.classList.remove("hidden");
    }
    eFleteBuscar.addEventListener("focus", renderFleteLista);
    eFleteBuscar.addEventListener("input", () => { eFleteHidden.value = ""; renderFleteLista(); });
    eFleteBuscar.addEventListener("keydown", (e) => { if (e.key === "Escape") eFleteLista.classList.add("hidden"); });
    eFleteLista.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-id]");
      if (!btn) return;
      const f = fletes.find((x) => x.id === btn.getAttribute("data-id"));
      eFleteHidden.value = f?.id || "";
      eFleteBuscar.value = f ? `${f.empresa} — ${etiquetaTipoFlete(f.tipo)}` : "";
      eFleteLista.classList.add("hidden");
    });
    document.addEventListener("click", (e) => {
      if (e.target !== eFleteBuscar && !eFleteLista.contains(e.target)) eFleteLista.classList.add("hidden");
    });

    // ── Tipo de adquisición (solo en la página Herramientas): comprada o
    // arrendada -- si es arrendada, se pide la empresa (y opcionalmente
    // hasta cuándo) para poder dejarla pendiente por devolver. ───────────
    const bloqueTipoAdquisicion = document.getElementById("bloque-tipo-adquisicion");
    const camposArriendo = document.getElementById("campos-arriendo");
    const eTipoAdquisicion = document.getElementById("e-tipo-adquisicion");
    bloqueTipoAdquisicion.classList.toggle("hidden", !modoHerramienta);
    eTipoAdquisicion.addEventListener("change", () => {
      camposArriendo.classList.toggle("hidden", eTipoAdquisicion.value !== "arrendada");
    });

    function actualizarVistaEntrante() {
      const hayPedido = !!document.getElementById("e-pedido").value;
      // La lista de productos manuales solo aplica sin pedido elegido; con
      // pedido, se eligen varios productos del PM a la vez (otro bloque).
      bloqueProductoManual.classList.toggle("hidden", hayPedido);
      bloqueItemsPedido.classList.toggle("hidden", !hayPedido);
    }

    document.getElementById("btn-entrante").addEventListener("click", () => {
      formEntrante.reset();
      buscadorPedidoEntrante.reset();
      itemsPMSeleccionados = [];
      renderItemsPedidoElegidos();
      itemsManualSeleccionados = [nuevaFilaManual()];
      renderItemsManual();
      errEntrante.classList.add("hidden");
      facturasElegidasEntrante = [];
      renderFacturasElegidas();
      camposArriendo.classList.add("hidden");
      actualizarVistaEntrante();
      dlgEntrante.showModal();
    });

    formEntrante.addEventListener("submit", async (e) => {
      e.preventDefault();
      errEntrante.classList.add("hidden");
      const btn = document.getElementById("btn-guardar-entrante");
      btn.disabled = true; btn.textContent = "Guardando…";
      alternarBotonesLista([itemsPedidoElegidosCont, itemsManualCont], true);
      btnElegirItems.disabled = true; // cambiar la selección del PM a mitad de envío tiene el mismo riesgo
      document.getElementById("btn-agregar-producto-manual").disabled = true;
      try {
        const pedidoId = document.getElementById("e-pedido").value;
        const pedidoSeleccionado = pedidoId ? pedidos.find((p) => p.id === pedidoId) : null;
        const numeroOc = document.getElementById("e-documento").value;
        const proveedor = document.getElementById("e-proveedor").value;
        const motivo = document.getElementById("e-motivo").value;
        const ubicacion = eUbicacion.value;
        const fleteId = eFleteHidden.value || null;
        const fleteEmpresa = fleteId ? (fletes.find((f) => f.id === fleteId)?.empresa || "") : "";
        // Las mismas fotos de factura/guía van para todo este registro,
        // aunque sean varios productos a la vez (del mismo PM, o varios
        // manuales) -- no hace falta subirlas más de una vez.
        const facturas = await subirFacturasEntrada(facturasElegidasEntrante);

        // Tipo de adquisición (solo aplica en la página Herramientas): si
        // es arrendada, es la misma empresa para todos los productos de
        // este registro (igual que la factura/flete).
        const tipoAdquisicion = modoHerramienta ? eTipoAdquisicion.value : null;
        const empresaArriendo = tipoAdquisicion === "arrendada" ? document.getElementById("e-arriendo-empresa").value : "";
        if (tipoAdquisicion === "arrendada" && !empresaArriendo.trim()) {
          throw new Error("Indica la empresa arrendadora.");
        }

        if (pedidoSeleccionado) {
          if (!itemsPMSeleccionados.length) throw new Error("Elige al menos un producto del pedido.");
          // Se valida cantidad y categoría de todos los productos ANTES de
          // anotar la orden de compra o registrar nada, para no dejar a
          // mitad de camino un registro por un dato que faltaba desde el
          // principio. Se hace a mano (no con "required" del navegador)
          // porque con una lista larga y dentro de un <dialog> que
          // scrollea, el aviso nativo del navegador puede no verse y da
          // la impresión de que el botón "no hace nada" -- acá, en
          // cambio, se lleva la vista directo a la fila con el problema.
          const llevarVistaA = (campo) => {
            campo.scrollIntoView({ behavior: "smooth", block: "center" });
            campo.focus();
          };
          for (const item of itemsPMSeleccionados) {
            const fila = itemsPedidoElegidosCont.querySelector(`.item-pedido-fila[data-item-id="${item.id}"]`);
            const campoCantidad = fila.querySelector(".ie-cantidad");
            const cantidadValor = campoCantidad.value;
            if (cantidadValor === "" || Number.isNaN(Number(cantidadValor)) || Number(cantidadValor) < 0) {
              llevarVistaA(campoCantidad);
              throw new Error(`${item.glosa}: ingresa la cantidad recibida.`);
            }
            if (item.existenteId) continue;
            const campoCategoria = fila.querySelector(".ie-categoria");
            if (!campoCategoria?.value) {
              llevarVistaA(campoCategoria);
              throw new Error(`${item.glosa}: elige una categoría.`);
            }
            try {
              validarStockMinimo(campoCategoria.value, fila.querySelector(".ie-minimo")?.value);
            } catch (errMinimo) {
              llevarVistaA(fila.querySelector(".ie-minimo"));
              throw new Error(`${item.glosa}: ${errMinimo.message}`);
            }
          }
          let registrados = 0;
          for (const item of [...itemsPMSeleccionados]) {
            const fila = itemsPedidoElegidosCont.querySelector(`.item-pedido-fila[data-item-id="${item.id}"]`);
            const existente = item.existenteId ? materialesTodos.find((m) => m.id === item.existenteId) : null;
            try {
              const ordenAnotada = await anotarOrdenDeCompra(ordenesCompra, {
                pmId: pedidoSeleccionado.id, numero: numeroOc, proveedor, item,
              });
              if (!ordenesCompra.some((o) => o.id === ordenAnotada.id)) {
                ordenesCompra = [...ordenesCompra, ordenAnotada]; // hasta que llegue la actualización en vivo
              }
              const datos = {
                cantidadRecibida: fila.querySelector(".ie-cantidad").value,
                proveedor,
                documento: "", // ya queda anotado como ordenCompraNumero, no hace falta repetirlo
                motivo,
                observacionRecepcion: fila.querySelector(".ie-observacion")?.value || "",
                ubicacion,
                ordenCompraId: ordenAnotada.id,
                ordenCompraNumero: ordenAnotada.numero,
                pmItemId: item.id,
                fleteId,
                fleteEmpresa,
                facturas,
                tipoAdquisicion,
                empresaArriendo,
              };
              if (existente) {
                datos.materialId = existente.id;
              } else {
                const campoUnidad = fila.querySelector(".ie-unidad");
                const campoCategoria = fila.querySelector(".ie-categoria");
                const campoMinimo = fila.querySelector(".ie-minimo");
                datos.nuevoMaterial = {
                  producto: item.glosa,
                  categoria: campoCategoria.value,
                  obra: obraActiva(),
                  unidad: campoUnidad ? campoUnidad.value : item.unidad,
                  medida: "",
                  centroGestion: item.centroGestion,
                  centroCosto: item.centroCosto,
                  stockMinimo: campoMinimo ? campoMinimo.value : 0,
                  ubicacion,
                  descripcion: "",
                };
              }
              const resultado = await registrarEntrada(datos);
              if (tipoAdquisicion === "arrendada") {
                await crearArriendo({
                  materialId: resultado.materialId,
                  materialProducto: resultado.materialProducto,
                  obra: resultado.obra,
                  cantidad: datos.cantidadRecibida,
                  empresa: empresaArriendo,
                  movimientoEntradaId: resultado.movimientoId,
                });
              }
              registrados++;
              itemsPMSeleccionados = itemsPMSeleccionados.filter((x) => x.id !== item.id);
            } catch (errItem) {
              sincronizarItemsDesdeDom();
              renderItemsPedidoElegidos();
              throw new Error(
                `${item.glosa}: ${errItem.message}` +
                (registrados ? ` (ya se registraron ${registrados} producto${registrados === 1 ? "" : "s"} antes de este error, no hace falta repetirlos)` : ""),
              );
            }
          }
          renderItemsPedidoElegidos();
        } else {
          if (!itemsManualSeleccionados.length) throw new Error("Agrega al menos un producto.");
          // A diferencia de los ítems de un PM, estas filas son
          // <details> colapsables (ver renderItemsManual): si el campo
          // con el problema quedó en una fila ya cerrada, hay que
          // abrirla primero -- si no, scrollIntoView/focus no hacen nada
          // visible (un campo con display:none no se puede enfocar) y
          // el usuario no sabe cuál de varias filas "Producto nuevo"
          // colapsadas es la que falta completar.
          const llevarVistaA = (campo) => {
            campo.closest(".item-manual-fila").open = true;
            campo.scrollIntoView({ behavior: "smooth", block: "center" });
            campo.focus();
          };
          // Se valida todo ANTES de registrar nada, igual que con un PM
          // elegido (ver más arriba): así no queda a mitad de camino un
          // registro por un dato que faltaba desde el principio.
          for (const item of itemsManualSeleccionados) {
            const fila = itemsManualCont.querySelector(`.item-manual-fila[data-row-id="${item.id}"]`);
            if (!fila) continue; // ya no está en el DOM (se quitó) -- nada que validar
            const materialId = fila.querySelector(".im-producto").value;
            const nuevoProducto = fila.querySelector(".im-nuevo-producto").value;
            const campoBuscar = fila.querySelector(".im-buscar");
            if (!materialId && !nuevoProducto.trim()) {
              llevarVistaA(campoBuscar);
              throw new Error("Indica o elige un producto en cada fila.");
            }
            const campoCantidad = fila.querySelector(".im-cantidad");
            if (campoCantidad.value === "" || Number.isNaN(Number(campoCantidad.value)) || Number(campoCantidad.value) <= 0) {
              llevarVistaA(campoCantidad);
              throw new Error(`${nuevoProducto || fila.querySelector(".im-buscar").value}: ingresa la cantidad recibida.`);
            }
            if (materialId) continue;
            const campoCategoria = fila.querySelector(".im-categoria");
            if (!campoCategoria.value) {
              llevarVistaA(campoCategoria);
              throw new Error(`${nuevoProducto}: elige una categoría.`);
            }
            if (!fila.querySelector(".im-unidad").value.trim()) {
              llevarVistaA(fila.querySelector(".im-unidad"));
              throw new Error(`${nuevoProducto}: indica la unidad.`);
            }
            try {
              validarStockMinimo(campoCategoria.value, fila.querySelector(".im-minimo").value);
            } catch (errMinimo) {
              llevarVistaA(fila.querySelector(".im-minimo"));
              throw new Error(`${nuevoProducto}: ${errMinimo.message}`);
            }
          }
          let registrados = 0;
          for (const item of [...itemsManualSeleccionados]) {
            const fila = itemsManualCont.querySelector(`.item-manual-fila[data-row-id="${item.id}"]`);
            if (!fila) continue; // ya no está en el DOM (se quitó) -- nada que registrar
            const materialId = fila.querySelector(".im-producto").value;
            const nuevoProducto = fila.querySelector(".im-nuevo-producto").value;
            const nombreParaError = nuevoProducto || materiales.find((m) => m.id === materialId)?.producto || "Producto";
            try {
              const datos = {
                cantidadRecibida: fila.querySelector(".im-cantidad").value,
                proveedor,
                documento: numeroOc,
                motivo,
                ubicacion,
                ordenCompraId: null,
                ordenCompraNumero: "",
                pmItemId: null,
                fleteId,
                fleteEmpresa,
                facturas,
                tipoAdquisicion,
                empresaArriendo,
              };
              if (materialId) {
                datos.materialId = materialId;
              } else {
                datos.nuevoMaterial = {
                  producto: nuevoProducto,
                  categoria: fila.querySelector(".im-categoria").value,
                  obra: obraActiva(),
                  unidad: fila.querySelector(".im-unidad").value,
                  medida: fila.querySelector(".im-medida").value,
                  centroGestion: fila.querySelector(".im-centro-gestion").value,
                  centroCosto: fila.querySelector(".im-centro-costo").value,
                  stockMinimo: fila.querySelector(".im-minimo").value,
                  ubicacion,
                  descripcion: fila.querySelector(".im-descripcion").value,
                  tipoHerramienta: modoHerramienta ? fila.querySelector(".im-tipo-herramienta").value : "",
                };
              }
              const resultado = await registrarEntrada(datos);
              if (tipoAdquisicion === "arrendada") {
                await crearArriendo({
                  materialId: resultado.materialId,
                  materialProducto: resultado.materialProducto,
                  obra: resultado.obra,
                  cantidad: datos.cantidadRecibida,
                  empresa: empresaArriendo,
                  movimientoEntradaId: resultado.movimientoId,
                });
              }
              registrados++;
              itemsManualSeleccionados = itemsManualSeleccionados.filter((x) => x.id !== item.id);
            } catch (errItem) {
              sincronizarItemsManualDesdeDom();
              renderItemsManual();
              throw new Error(
                `${nombreParaError}: ${errItem.message}` +
                (registrados ? ` (ya se registraron ${registrados} producto${registrados === 1 ? "" : "s"} antes de este error, no hace falta repetirlos)` : ""),
              );
            }
          }
          renderItemsManual();
        }
        dlgEntrante.close();
        flash("Material entrante registrado.");
      } catch (err) {
        errEntrante.textContent = err.message;
        errEntrante.classList.remove("hidden");
      } finally {
        btn.disabled = false; btn.textContent = "Registrar";
        alternarBotonesLista([itemsPedidoElegidosCont, itemsManualCont], false);
        btnElegirItems.disabled = false;
        document.getElementById("btn-agregar-producto-manual").disabled = false;
      }
    });

    // ── Material saliente ───────────────────────────────────────────────
    // Uno o varios productos a la vez (mismo patrón que Material entrante:
    // filas colapsables, cada una con su propio buscador y cantidad; el
    // resto -- persona que retira, vale, supervisor, etc. -- es compartido
    // para todo el registro).
    const dlgSaliente = document.getElementById("dlg-saliente");
    const formSaliente = document.getElementById("form-saliente");
    const errSaliente = document.getElementById("err-saliente");
    const itemsSalidaCont = document.getElementById("items-salida-lista");
    let itemsSalidaSeleccionados = []; // [{id, abierto}] -- el resto vive en el DOM de cada fila

    function nuevaFilaSalida() {
      return { id: crypto.randomUUID(), abierto: true };
    }

    function sincronizarItemsSalidaDesdeDom() {
      itemsSalidaSeleccionados.forEach((item) => {
        const fila = itemsSalidaCont.querySelector(`.item-salida-fila[data-row-id="${item.id}"]`);
        if (!fila) return;
        item.textoBuscador = fila.querySelector(".is-buscar").value;
        item.materialId = fila.querySelector(".is-producto").value;
        item.cantidad = fila.querySelector(".is-cantidad").value;
        item.abierto = fila.open;
      });
    }

    function actualizarResumenFilaSalida(fila) {
      const resumen = fila.querySelector(".is-resumen");
      const materialId = fila.querySelector(".is-producto").value;
      const cantidad = fila.querySelector(".is-cantidad").value;
      const m = materialId ? materiales.find((x) => x.id === materialId) : null;
      if (!m) { resumen.textContent = "Producto"; return; }
      resumen.textContent = `${m.producto}${cantidad ? ` — ${fmtNum(cantidad)} ${m.unidad}` : ""}`;
    }

    function renderItemsSalida() {
      itemsSalidaCont.innerHTML = itemsSalidaSeleccionados.map((item) => {
        const existente = item.materialId ? materiales.find((m) => m.id === item.materialId) : null;
        return `
          <details class="item-pedido-fila item-salida-fila lista-desplegable" data-row-id="${item.id}" ${item.abierto ? "open" : ""}>
            <summary style="display:flex; justify-content:space-between; gap:10px;">
              <span class="is-resumen">Producto</span>
