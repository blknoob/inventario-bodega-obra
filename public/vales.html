<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vales | Inventario de Bodega</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header id="topbar"></header>

  <div class="wrap">
    <div id="flash" class="alert hidden"></div>

    <div class="page-head">
      <h1>Vales de entrega</h1>
      <p id="titulo-sub"></p>
    </div>

    <!-- ── Capataz / supervisor / prevencionista: pedir un vale ──────────── -->
    <div class="card hidden" id="bloque-nuevo" style="margin-bottom:18px;">
      <h2 class="card-titulo" id="nuevo-titulo">Nuevo vale</h2>
      <form id="form-vale">
        <div id="err-vale" class="alert alert-error hidden"></div>
        <div class="row">
          <div class="field">
            <label for="v-trabajador">Nombre del trabajador</label>
            <input type="text" id="v-trabajador" required maxlength="80" autocomplete="off" />
          </div>
          <div class="field">
            <label for="v-actividad">Actividad</label>
            <input type="text" id="v-actividad" required maxlength="80" autocomplete="off" />
          </div>
        </div>

        <label>Productos</label>
        <div id="v-items"></div>
        <button type="button" class="btn btn-ghost btn-block" id="btn-agregar-item" style="margin-top:8px; margin-bottom:14px;">+ Agregar otro producto</button>

        <div class="field">
          <label for="v-observacion">Observación <span class="muted">(opcional)</span></label>
          <input type="text" id="v-observacion" maxlength="160" />
        </div>
        <div class="modal-foot" style="margin-top:0;">
          <button type="submit" class="btn btn-primary" id="btn-enviar-vale">Crear vale y mostrar QR</button>
        </div>
      </form>
    </div>

    <!-- ── Listado (bodega: todos los de la obra; resto: los propios) ────── -->
    <div class="grid grid-estados" style="margin-bottom: 18px;">
      <button type="button" class="stat" data-estado="por_aprobar">
        <div class="label">Por aprobar</div>
        <div class="value" id="stat-por_aprobar">—</div>
      </button>
      <button type="button" class="stat" data-estado="pendiente">
        <div class="label">Por entregar</div>
        <div class="value stock-bajo" id="stat-pendiente">—</div>
      </button>
      <button type="button" class="stat" data-estado="entregado">
        <div class="label">Entregados</div>
        <div class="value stock-ok" id="stat-entregado">—</div>
      </button>
      <button type="button" class="stat" data-estado="rechazado">
        <div class="label">Rechazados / anulados</div>
        <div class="value stock-cero" id="stat-rechazado">—</div>
      </button>
    </div>

    <div class="card">
      <div class="toolbar">
        <div class="filters">
          <input type="search" id="buscar" placeholder="Buscar trabajador, actividad, producto, N.º…" autocomplete="off" />
          <select id="filtro-tipo" class="hidden">
            <option value="">Materiales y EPP</option>
            <option value="material">Materiales</option>
            <option value="epp">EPP</option>
          </select>
        </div>
      </div>
      <div id="lista-vales"><p class="empty">Cargando…</p></div>
    </div>
  </div>

  <!-- ── Modal: entregar o rechazar (bodega) ────────────────────────────── -->
  <dialog id="dlg-accion">
    <div class="modal-head">
      <h3 id="accion-titulo">Entregar vale</h3>
      <button type="button" class="modal-close" data-close>&times;</button>
    </div>
    <form id="form-accion">
      <div id="err-accion" class="alert alert-error hidden"></div>
      <div id="accion-resumen" class="text-sm" style="margin-bottom:12px;"></div>
      <div class="field hidden" id="bloque-motivo">
        <label for="a-motivo">Motivo del rechazo</label>
        <input type="text" id="a-motivo" maxlength="160" />
      </div>
      <div class="modal-foot">
        <button type="button" class="btn btn-ghost" data-close>Cancelar</button>
        <button type="submit" class="btn btn-primary" id="btn-accion">Entregar</button>
      </div>
    </form>
  </dialog>

  <!-- ── Modal: QR para que el trabajador apruebe (quien pide) ──────────── -->
  <dialog id="dlg-qr">
    <div class="modal-head">
      <h3 id="qr-titulo">Aprobación del trabajador</h3>
      <button type="button" class="modal-close" data-close>&times;</button>
    </div>
    <div class="qr-cuerpo">
      <p class="text-sm" id="qr-instruccion" style="margin:0 0 12px;"></p>
      <div id="qr-imagen" class="qr-imagen"></div>
      <div id="qr-estado" class="alert alert-info" style="margin:12px 0 0;"></div>
      <div class="modal-foot">
        <button type="button" class="btn btn-ghost" id="btn-qr-compartir">Compartir enlace</button>
        <button type="button" class="btn btn-primary" data-close>Listo</button>
      </div>
    </div>
  </dialog>

  <script type="module">
    import qrcode from "https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/+esm";
    import { montarTopbar, flash } from "./js/ui.js";
    import { requerirRol, etiquetaRol, ROLES } from "./js/auth.js";
    import { escucharMateriales } from "./js/materiales.js";
    import {
      TIPOS_VALE, ESTADOS_VALE, MAX_ITEMS_VALE, numeroValeTexto, materialesParaVale,
      crearVale, entregarVale, rechazarVale, escucharValesObra, escucharMisVales, enlaceAprobacion, anularVale, aprobarValeEnBodega,
    } from "./js/vales.js";
    import { obraActiva, etiquetaObra, escucharConObraActiva, escucharObraActiva } from "./js/obra.js";

    montarTopbar("vales");

    const fmtNum = (n) => (Number(n) || 0).toLocaleString("es-CL", { maximumFractionDigits: 3 });
    const fmtFecha = (ts) => {
      const d = ts?.toDate?.();
      if (!d) return "—";
      return d.toLocaleDateString("es-CL") + " " +
        d.toLocaleTimeString("es-CL", { hour: "2-digit", minute: "2-digit" });
    };
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const normalizar = (s) => String(s || "").trim().toLowerCase()
      .normalize("NFD").replace(/[̀-ͯ]/g, "");

    const listaVales = document.getElementById("lista-vales");
    const buscar = document.getElementById("buscar");
    const filtroTipo = document.getElementById("filtro-tipo");
    const statCards = [...document.querySelectorAll("button.stat[data-estado]")];

    let perfil = null;
    let esBodega = false;
    let materiales = []; // catálogo de la obra activa (todas las categorías)
    let vales = [];
    // Siempre hay una pestaña elegida: "Por entregar" es un listado (ahí se
    // actúa); "Entregados" y "Rechazados" se ven en un calendario, por el día
    // en que se entregaron/rechazaron.
    let filtroEstado = "pendiente";
    let mesCalendario = null; // Date del día 1 del mes que se muestra
    let diaElegido = null;    // "YYYY-MM-DD"

    // ── Listado ─────────────────────────────────────────────────────────
    function setFiltroEstado(estado) {
      filtroEstado = estado;
      mesCalendario = null; // al cambiar de pestaña, vuelve al día más reciente con vales
      diaElegido = null;
      statCards.forEach((c) => c.classList.toggle("active", c.dataset.estado === filtroEstado));
      render();
    }
    statCards.forEach((c) => c.addEventListener("click", () => setFiltroEstado(c.dataset.estado)));
    buscar.addEventListener("input", render);
    filtroTipo.addEventListener("change", render);

    function coincide(v, q) {
      if (!q) return true;
      return [numeroValeTexto(v.numero), v.trabajador, v.actividad, v.solicitanteNombre, ...v.items.map((it) => it.producto)]
        .some((t) => normalizar(t).includes(q));
    }

    function tarjetaVale(v) {
      const estado = ESTADOS_VALE[v.estado] || { etiqueta: v.estado, badge: "badge-muted" };
      const pendiente = v.estado === "pendiente";
      const porAprobar = v.estado === "por_aprobar";
      const filas = v.items.map((it) => {
        const m = materiales.find((x) => x.id === it.materialId);
        const stock = m ? Number(m.stock) || 0 : null;
        const falta = pendiente && (stock === null || Number(it.cantidad) > stock);
        const stockTxt = !pendiente ? "" : stock === null
          ? `<span class="stock-cero">ya no existe</span>`
          : `<span class="${falta ? "stock-cero" : "muted"}">stock ${fmtNum(stock)}</span>`;
        return `
          <tr>
            <td>${esc(it.producto)}</td>
            <td class="text-right nowrap"><strong>${fmtNum(it.cantidad)}</strong> ${esc(it.unidad)}</td>
            ${pendiente ? `<td class="text-right nowrap text-sm">${stockTxt}</td>` : ""}
          </tr>`;
      }).join("");

      const pie = [];
      if (v.aprobadoEn) {
        pie.push(v.aprobadoEnBodegaPor
          ? `Aprobado por el trabajador en bodega ${fmtFecha(v.aprobadoEn)} (${esc(v.aprobadoEnBodegaPor)})`
          : `Aprobado por el trabajador con QR ${fmtFecha(v.aprobadoEn)}`);
      }
      if (v.estado === "entregado") pie.push(`Entregado ${fmtFecha(v.entregadoEn)} por ${esc(v.entregadoPor || "bodega")}`);
      if (v.estado === "anulado") pie.push(`Anulado ${fmtFecha(v.anuladoEn)} por quien lo pidió`);
      if (v.estado === "rechazado") pie.push(`Rechazado ${fmtFecha(v.rechazadoEn)}: <strong>${esc(v.motivoRechazo)}</strong>`);

      return `
        <div class="vale-card" data-vale="${v.id}">
          <div class="vale-head">
            <div>
              <strong>${numeroValeTexto(v.numero)}</strong>
              <span class="badge badge-muted">${esc(TIPOS_VALE[v.tipo]?.etiqueta ?? v.tipo)}</span>
              <span class="badge ${estado.badge}">${esc(estado.etiqueta)}</span>
            </div>
            <span class="text-sm muted nowrap">Pedido ${fmtFecha(v.creadoEn)}</span>
          </div>
          <div class="vale-datos text-sm">
            <span><span class="muted">Trabajador:</span> <strong>${esc(v.trabajador)}</strong></span>
            <span><span class="muted">Actividad:</span> ${esc(v.actividad)}</span>
            ${esBodega ? `<span><span class="muted">Pide:</span> ${esc(v.solicitanteNombre)} (${esc(etiquetaRol(v.solicitanteRol))})</span>` : ""}
          </div>
          ${v.observacion ? `<p class="text-sm" style="margin:6px 0 0;"><span class="muted">Observación:</span> ${esc(v.observacion)}</p>` : ""}
          <table class="vale-items"><tbody>${filas}</tbody></table>
          ${pie.length ? `<p class="text-sm muted" style="margin:8px 0 0;">${pie.join(" · ")}</p>` : ""}
          ${porAprobar ? `<p class="text-sm muted" style="margin:8px 0 0;">${esBodega
            ? `Esperando que ${esc(v.trabajador)} lo apruebe con el QR. Si no tiene celular, puede aprobarlo aquí en bodega.`
            : `Esperando que ${esc(v.trabajador)} lo apruebe con el QR (o en bodega, si no tiene celular).`}</p>` : ""}
          ${porAprobar && esBodega ? `
            <div class="row-actions" style="margin-top:10px; justify-content:flex-end;">
              <button type="button" class="btn btn-primary btn-xs" data-aprobar="${v.id}">Aprobar en bodega</button>
            </div>` : ""}
          ${porAprobar && !esBodega && v.tokenAprobacion ? `
            <div class="row-actions" style="margin-top:10px; justify-content:flex-end;">
              <button type="button" class="btn btn-ghost btn-danger btn-xs" data-anular="${v.id}">Anular</button>
              <button type="button" class="btn btn-primary btn-xs" data-qr="${v.id}">Mostrar QR</button>
            </div>` : ""}
          ${esBodega && pendiente ? `
            <div class="row-actions" style="margin-top:10px; justify-content:flex-end;">
              <button type="button" class="btn btn-ghost btn-danger btn-xs" data-rechazar="${v.id}">Rechazar</button>
              <button type="button" class="btn btn-primary btn-xs" data-entregar="${v.id}">Entregar</button>
            </div>` : ""}
        </div>`;
    }

    // "YYYY-MM-DD" en horario local.
    const fechaISO = (d) =>
      `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    const fechaCierre = (v) => ({ entregado: v.entregadoEn, rechazado: v.rechazadoEn, anulado: v.anuladoEn })[v.estado]?.toDate?.() || null;
    // Los anulados se ven junto a los rechazados (ninguno se entregó).
    const pestanaDe = (v) => (v.estado === "anulado" ? "rechazado" : v.estado);
    const mayuscula = (t) => t.charAt(0).toUpperCase() + t.slice(1);
    const fmtHora = (d) => d.toLocaleTimeString("es-CL", { hour: "2-digit", minute: "2-digit" });

    // Un vale ya cerrado, colapsado a una línea; se abre para ver el detalle.
    function valeDesplegable(v) {
      const d = fechaCierre(v);
      const productos = v.items.length === 1 ? "1 producto" : `${v.items.length} productos`;
      return `
        <details class="vale-desplegable">
          <summary>
            <strong>${numeroValeTexto(v.numero)}</strong>
            <span>${esc(v.trabajador)}</span>
            <span class="muted">${esc(v.actividad)} · ${productos}</span>
            <span class="muted nowrap">${d ? fmtHora(d) : ""}</span>
          </summary>
          ${tarjetaVale(v)}
        </details>`;
    }

    function calendario(porDia) {
      const anio = mesCalendario.getFullYear();
      const mes = mesCalendario.getMonth();
      const hoy = fechaISO(new Date());
      // Lunes primero: getDay() da 0 para domingo.
      const desfase = (new Date(anio, mes, 1).getDay() + 6) % 7;
      const diasMes = new Date(anio, mes + 1, 0).getDate();
      const celdas = [];
      for (let i = 0; i < desfase; i++) celdas.push(`<span class="cal-dia vacio"></span>`);
      for (let dia = 1; dia <= diasMes; dia++) {
        const iso = fechaISO(new Date(anio, mes, dia));
        const n = porDia.get(iso)?.length || 0;
        const clases = ["cal-dia", n ? "con-vales" : "", iso === diaElegido ? "elegido" : "", iso === hoy ? "hoy" : ""].join(" ");
        celdas.push(`
          <button type="button" class="${clases}" data-dia="${iso}" ${n ? "" : "disabled"} aria-label="${dia}${n ? `, ${n} vale${n === 1 ? "" : "s"}` : ""}">
            <span>${dia}</span>${n ? `<span class="cal-n">${n}</span>` : ""}
          </button>`);
      }
      const titulo = mayuscula(mesCalendario.toLocaleDateString("es-CL", { month: "long", year: "numeric" }));
      return `
        <div class="calendario">
          <div class="cal-head">
            <button type="button" class="btn btn-ghost btn-xs" data-mes="-1" aria-label="Mes anterior">‹</button>
            <strong class="cal-titulo">${esc(titulo)}</strong>
            <button type="button" class="btn btn-ghost btn-xs" data-mes="1" aria-label="Mes siguiente">›</button>
          </div>
          <div class="cal-grilla">
            ${["L", "M", "M", "J", "V", "S", "D"].map((d) => `<span class="cal-semana">${d}</span>`).join("")}
            ${celdas.join("")}
          </div>
        </div>`;
    }

    function render() {
      if (!perfil) return;
      const q = normalizar(buscar.value);
      const tipo = filtroTipo.value;
      const base = vales.filter((v) => !tipo || v.tipo === tipo);
      for (const c of statCards) {
        document.getElementById(`stat-${c.dataset.estado}`).textContent = base.filter((v) => pestanaDe(v) === c.dataset.estado).length;
      }
      const vista = base.filter((v) => pestanaDe(v) === filtroEstado && coincide(v, q));
      const sinVales = `<p class="empty">${vales.length ? "Sin vales para este filtro." : esBodega ? "Aún no llegan vales en esta obra." : "Aún no has enviado vales en esta obra."}</p>`;

      if (filtroEstado === "pendiente" || filtroEstado === "por_aprobar") {
        // Por entregar: del más antiguo al más nuevo (orden de llegada a
        // bodega). Por aprobar: el recién pedido arriba.
        if (filtroEstado === "pendiente") vista.reverse();
        listaVales.innerHTML = vista.length ? vista.map(tarjetaVale).join("") : sinVales;
        return;
      }

      const porDia = new Map();
      for (const v of vista) {
        const d = fechaCierre(v);
        if (!d) continue; // recién cerrado: la hora del servidor llega en el próximo snapshot
        const iso = fechaISO(d);
        if (!porDia.has(iso)) porDia.set(iso, []);
        porDia.get(iso).push(v);
      }
      // Sin día elegido (recién abierta la pestaña): el más reciente con vales, o hoy.
      if (!diaElegido) {
        diaElegido = [...porDia.keys()].sort().pop() || fechaISO(new Date());
      }
      if (!mesCalendario) {
        const [a, m] = diaElegido.split("-").map(Number);
        mesCalendario = new Date(a, m - 1, 1);
      }
      const delDia = (porDia.get(diaElegido) || [])
        .sort((a, b) => fechaCierre(b) - fechaCierre(a));
      const [a, m, d] = diaElegido.split("-").map(Number);
      const tituloDia = mayuscula(new Date(a, m - 1, d).toLocaleDateString("es-CL", { weekday: "long", day: "numeric", month: "long" }));
      const accion = filtroEstado === "entregado" ? "entregados" : "rechazados ni anulados";

      listaVales.innerHTML = `
        <div class="vales-calendario">
          ${calendario(porDia)}
          <div class="vales-del-dia">
            <h3 class="text-sm" style="margin:0 0 10px;">${esc(tituloDia)}</h3>
            ${delDia.length
              ? delDia.map(valeDesplegable).join("")
              : `<p class="empty" style="padding:16px 0;">${porDia.size ? `Ningún vale ${accion} este día.` : `Sin vales ${accion}${q || tipo ? " para este filtro" : ""}.`}</p>`}
          </div>
        </div>`;
    }

    // Navegación del calendario (delegada: el calendario se redibuja entero).
    listaVales.addEventListener("click", (e) => {
      const dia = e.target.closest("[data-dia]");
      if (dia) { diaElegido = dia.dataset.dia; render(); return; }
      const mes = e.target.closest("[data-mes]");
      if (mes) {
        mesCalendario = new Date(mesCalendario.getFullYear(), mesCalendario.getMonth() + Number(mes.dataset.mes), 1);
        render();
      }
    });

    // ── Entregar / rechazar (bodega) ────────────────────────────────────
    const dlgAccion = document.getElementById("dlg-accion");
    const formAccion = document.getElementById("form-accion");
    const errAccion = document.getElementById("err-accion");
    const btnAccion = document.getElementById("btn-accion");
    const motivoInput = document.getElementById("a-motivo");
    let accion = null; // { tipo: "entregar" | "rechazar" | "aprobar", valeId }
    let enviandoAccion = false;

    function abrirAccion(tipo, valeId) {
      const v = vales.find((x) => x.id === valeId);
      if (!v) return;
      accion = { tipo, valeId };
      const rechazar = tipo === "rechazar";
      const titulos = { entregar: "Entregar", rechazar: "Rechazar", aprobar: "Aprobar en bodega" };
      const notas = {
        entregar: "Se descuenta del stock y queda registrado en el Historial.",
        aprobar: `Muéstrale o léele el listado a <strong>${esc(v.trabajador)}</strong>. Confirma solo si está de acuerdo con lo que va a retirar; después puedes entregarlo.`,
      };
      document.getElementById("accion-titulo").textContent = `${titulos[tipo]} ${numeroValeTexto(v.numero)}`;
      document.getElementById("accion-resumen").innerHTML = `
        <p style="margin:0 0 6px;">Para <strong>${esc(v.trabajador)}</strong> — ${esc(v.actividad)}</p>
        <ul style="margin:0; padding-left:18px;">${v.items.map((it) => `<li>${esc(it.producto)}: <strong>${fmtNum(it.cantidad)}</strong> ${esc(it.unidad)}</li>`).join("")}</ul>
        ${notas[tipo] ? `<p class="muted" style="margin:8px 0 0;">${notas[tipo]}</p>` : ""}`;
      document.getElementById("bloque-motivo").classList.toggle("hidden", !rechazar);
      motivoInput.required = rechazar;
      motivoInput.value = "";
      btnAccion.textContent = { entregar: "Marcar entregado", rechazar: "Rechazar vale", aprobar: "El trabajador aprueba" }[tipo];
      btnAccion.className = `btn ${rechazar ? "btn-danger-solid" : "btn-primary"}`;
      errAccion.classList.add("hidden");
      dlgAccion.showModal();
      if (rechazar) motivoInput.focus();
    }

    listaVales.addEventListener("click", (e) => {
      const entregar = e.target.closest("[data-entregar]");
      const rechazar = e.target.closest("[data-rechazar]");
      const aprobar = e.target.closest("[data-aprobar]");
      if (entregar) abrirAccion("entregar", entregar.dataset.entregar);
      if (rechazar) abrirAccion("rechazar", rechazar.dataset.rechazar);
      if (aprobar) abrirAccion("aprobar", aprobar.dataset.aprobar);
    });

    // Con un envío en curso no se puede cerrar (ni por X, Cancelar, clic
    // afuera o Escape): reabrirlo para otro vale a mitad de camino haría
    // que el aviso final hable del vale equivocado.
    dlgAccion.querySelectorAll("[data-close]").forEach((b) =>
      b.addEventListener("click", () => { if (!enviandoAccion) dlgAccion.close(); }));
    dlgAccion.addEventListener("cancel", (e) => { if (enviandoAccion) e.preventDefault(); });
    dlgAccion.addEventListener("click", (e) => {
      if (enviandoAccion) return;
      const r = dlgAccion.getBoundingClientRect();
      const dentro = e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
      if (!dentro) dlgAccion.close();
    });

    formAccion.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!accion || enviandoAccion) return;
      const { tipo, valeId } = accion; // capturado: no releer `accion` después de un await
      const numero = numeroValeTexto(vales.find((x) => x.id === valeId)?.numero);
      errAccion.classList.add("hidden");
      enviandoAccion = true;
      const textoBoton = btnAccion.textContent;
      btnAccion.disabled = true;
      btnAccion.textContent = "Guardando…";
      dlgAccion.querySelectorAll("[data-close]").forEach((b) => { b.disabled = true; });
      try {
        if (tipo === "entregar") {
          await entregarVale(valeId);
          flash(`${numero} entregado. Stock descontado.`);
        } else if (tipo === "aprobar") {
          await aprobarValeEnBodega(valeId);
          flash(`${numero} aprobado en bodega. Ya puedes entregarlo.`);
          setFiltroEstado("pendiente");
        } else {
          await rechazarVale(valeId, motivoInput.value);
          flash(`${numero} rechazado.`);
        }
        enviandoAccion = false;
        dlgAccion.close();
      } catch (err) {
        errAccion.textContent = err.message;
        errAccion.classList.remove("hidden");
      } finally {
        enviandoAccion = false;
        btnAccion.disabled = false;
        btnAccion.textContent = textoBoton;
        dlgAccion.querySelectorAll("[data-close]").forEach((b) => { b.disabled = false; });
      }
    });

    // ── QR de aprobación (quien pide) ───────────────────────────────────
    const dlgQr = document.getElementById("dlg-qr");
    const qrEstado = document.getElementById("qr-estado");
    const btnCompartir = document.getElementById("btn-qr-compartir");
    let qrValeId = null;
    let qrEnlace = "";

    function refrescarEstadoQr() {
      const v = vales.find((x) => x.id === qrValeId);
      if (!v || v.estado === "por_aprobar") {
        qrEstado.className = "alert alert-info";
        qrEstado.textContent = "Esperando la aprobación del trabajador…";
      } else {
        qrEstado.className = "alert alert-ok";
        qrEstado.textContent = v.estado === "pendiente"
          ? "✓ Aprobado por el trabajador. Ya le aparece a bodega: puede ir a retirar."
          : `✓ Aprobado por el trabajador (${(ESTADOS_VALE[v.estado]?.etiqueta ?? v.estado).toLowerCase()}).`;
      }
    }

    // `datos` sirve recién creado el vale, antes de que llegue el snapshot.
    function abrirQr(valeId, datos) {
      const v = vales.find((x) => x.id === valeId) || datos;
      if (!v?.tokenAprobacion) return;
      qrValeId = valeId;
      qrEnlace = enlaceAprobacion(v.tokenAprobacion);
      const qr = qrcode(0, "M");
      qr.addData(qrEnlace);
      qr.make();
      document.getElementById("qr-imagen").innerHTML = qr.createSvgTag({ cellSize: 6, margin: 2, scalable: true });
      document.getElementById("qr-titulo").textContent = `${numeroValeTexto(v.numero)} — aprobación del trabajador`;
      document.getElementById("qr-instruccion").innerHTML =
        `Pídele a <strong>${esc(v.trabajador)}</strong> que escanee este código con la cámara de su celular y apruebe lo que va a retirar. Recién aprobado, el vale le llega a bodega.`;
      btnCompartir.textContent = navigator.share ? "Compartir enlace" : "Copiar enlace";
      refrescarEstadoQr();
      dlgQr.showModal();
    }

    btnCompartir.addEventListener("click", async () => {
      if (navigator.share) {
        try { await navigator.share({ title: "Aprobar vale", url: qrEnlace }); } catch { /* cancelado */ }
        return;
      }
      try {
        await navigator.clipboard.writeText(qrEnlace);
        btnCompartir.textContent = "¡Copiado!";
      } catch {
        prompt("Copia este enlace:", qrEnlace);
      }
    });
    dlgQr.querySelectorAll("[data-close]").forEach((b) => b.addEventListener("click", () => dlgQr.close()));
    dlgQr.addEventListener("click", (e) => {
      const r = dlgQr.getBoundingClientRect();
      const dentro = e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
      if (!dentro) dlgQr.close();
    });
    listaVales.addEventListener("click", async (e) => {
      const b = e.target.closest("[data-qr]");
      if (b) abrirQr(b.dataset.qr);
      const anular = e.target.closest("[data-anular]");
      if (!anular || anular.disabled) return;
      const v = vales.find((x) => x.id === anular.dataset.anular);
      if (!v || !confirm(`¿Anular ${numeroValeTexto(v.numero)} de ${v.trabajador}? El QR deja de servir y el vale no llega a bodega.`)) return;
      anular.disabled = true;
      try {
        await anularVale(v.id);
        flash(`${numeroValeTexto(v.numero)} anulado.`);
      } catch (err) {
        flash(err.message, "error");
        anular.disabled = false;
      }
    });

    // ── Nuevo vale (capataz / supervisor / prevencionista) ──────────────
    const formVale = document.getElementById("form-vale");
    const errVale = document.getElementById("err-vale");
    const itemsCont = document.getElementById("v-items");
    const btnAgregar = document.getElementById("btn-agregar-item");
    const btnEnviar = document.getElementById("btn-enviar-vale");
    let enviandoVale = false;

    const catalogoVale = () => materialesParaVale(perfil?.rol, materiales);

    function agregarFila() {
      const fila = document.createElement("div");
      fila.className = "vale-fila";
      fila.innerHTML = `
        <div class="field vale-fila-producto" style="position:relative;">
          <input type="text" class="vf-buscar buscador-input" placeholder="Busca el producto…" autocomplete="off" aria-label="Producto" />
          <input type="hidden" class="vf-id" />
          <div class="vf-lista buscador-lista hidden"></div>
          <p class="text-sm muted vf-stock" style="margin:4px 0 0;"></p>
        </div>
        <div class="field vale-fila-cantidad">
          <input type="number" class="vf-cantidad" min="0" step="any" placeholder="Cant." aria-label="Cantidad" inputmode="decimal" />
        </div>
        <button type="button" class="btn btn-ghost btn-xs btn-danger vf-quitar" aria-label="Quitar producto">✕</button>`;
      itemsCont.appendChild(fila);
      cablearFila(fila);
      actualizarBotonesFilas();
      return fila;
    }

    function actualizarBotonesFilas() {
      const filas = itemsCont.querySelectorAll(".vale-fila");
      filas.forEach((f) => { f.querySelector(".vf-quitar").style.visibility = filas.length > 1 ? "visible" : "hidden"; });
      btnAgregar.disabled = enviandoVale || filas.length >= MAX_ITEMS_VALE;
    }

    function textoStock(m, cantidad) {
      if (!m) return "";
      const stock = Number(m.stock) || 0;
      const aviso = Number(cantidad) > stock ? ` — <span class="stock-bajo">pides más de lo que hay; bodega podría no alcanzar a entregarlo</span>` : "";
      return `Stock en bodega: ${fmtNum(stock)} ${esc(m.unidad)}${aviso}`;
    }

    function refrescarStockFilas() {
      itemsCont.querySelectorAll(".vale-fila").forEach((fila) => {
        const m = materiales.find((x) => x.id === fila.querySelector(".vf-id").value);
        fila.querySelector(".vf-stock").innerHTML = textoStock(m, fila.querySelector(".vf-cantidad").value);
      });
    }

    function cablearFila(fila) {
      const input = fila.querySelector(".vf-buscar");
      const oculto = fila.querySelector(".vf-id");
      const lista = fila.querySelector(".vf-lista");
      const stockTxt = fila.querySelector(".vf-stock");
      const cantidad = fila.querySelector(".vf-cantidad");

      function renderLista() {
        const q = normalizar(input.value);
        const items = catalogoVale()
          .filter((m) => !q || normalizar(m.producto).includes(q))
          .slice(0, 30);
        lista.innerHTML = items.length
          ? items.map((m) => `
              <button type="button" class="btn btn-ghost btn-xs" data-id="${m.id}">
                ${esc(m.producto)}${m.medida ? ` (${esc(m.medida)})` : ""} — stock ${fmtNum(m.stock)} ${esc(m.unidad)}
              </button>`).join("")
          : `<div class="text-sm muted empty">${catalogoVale().length ? "Sin resultados." : "No hay productos cargados en esta obra."}</div>`;
        lista.classList.remove("hidden");
      }

      function elegir(m) {
        if (m) input.value = m.producto;
        oculto.value = m?.id || "";
        stockTxt.innerHTML = textoStock(m, cantidad.value);
        lista.classList.add("hidden");
      }

      input.addEventListener("focus", renderLista);
      input.addEventListener("input", () => {
        const exacto = catalogoVale().find((m) => normalizar(m.producto) === normalizar(input.value));
        elegir(exacto || null);
        renderLista();
      });
      input.addEventListener("keydown", (e) => { if (e.key === "Escape") lista.classList.add("hidden"); });
      lista.addEventListener("click", (e) => {
        const b = e.target.closest("[data-id]");
        if (!b) return;
        elegir(materiales.find((x) => x.id === b.dataset.id));
        cantidad.focus();
      });
      cantidad.addEventListener("input", () => {
        stockTxt.innerHTML = textoStock(materiales.find((x) => x.id === oculto.value), cantidad.value);
      });
      fila.querySelector(".vf-quitar").addEventListener("click", () => {
        if (enviandoVale) return;
        fila.remove();
        actualizarBotonesFilas();
      });
    }

    // Clic fuera de un buscador cierra su lista.
    document.addEventListener("click", (e) => {
      itemsCont.querySelectorAll(".vale-fila").forEach((fila) => {
        if (!fila.querySelector(".vale-fila-producto").contains(e.target)) fila.querySelector(".vf-lista").classList.add("hidden");
      });
    });

    function iniciarFormulario() {
      itemsCont.innerHTML = "";
      agregarFila();
    }

    btnAgregar.addEventListener("click", () => {
      agregarFila().querySelector(".vf-buscar").focus();
    });

    // Si cambia la obra con productos ya elegidos, esos productos son de la
    // otra obra: se parte de cero para no mandar un vale mezclado.
    escucharObraActiva(() => {
      if (perfil && !esBodega && !enviandoVale) iniciarFormulario();
    });

    formVale.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (enviandoVale) return;
      errVale.classList.add("hidden");
      const filas = [...itemsCont.querySelectorAll(".vale-fila")];
      try {
        const items = [];
        for (const fila of filas) {
          const buscarInput = fila.querySelector(".vf-buscar");
          const cantidadInput = fila.querySelector(".vf-cantidad");
          const m = materiales.find((x) => x.id === fila.querySelector(".vf-id").value);
          if (!m) {
            buscarInput.focus();
            throw new Error(buscarInput.value.trim()
              ? `"${buscarInput.value.trim()}" no está en el catálogo: elígelo de la lista.`
              : "Elige un producto de la lista en cada fila (o quita la fila vacía).");
          }
          if (!(Number(cantidadInput.value) > 0)) {
            cantidadInput.focus();
            throw new Error(`${m.producto}: ingresa la cantidad.`);
          }
          items.push({ materialId: m.id, producto: m.producto, unidad: m.unidad, cantidad: cantidadInput.value });
        }

        enviandoVale = true;
        btnEnviar.disabled = true;
        btnEnviar.textContent = "Enviando…";
        actualizarBotonesFilas();
        const trabajador = document.getElementById("v-trabajador").value.trim();
        const { id, numero, token } = await crearVale({
          perfil,
          obra: obraActiva(),
          trabajador,
          actividad: document.getElementById("v-actividad").value,
          observacion: document.getElementById("v-observacion").value,
          items,
        });
        formVale.reset();
        iniciarFormulario();
        flash(`${numeroValeTexto(numero)} creado (${etiquetaObra(obraActiva())}). Falta que el trabajador lo apruebe con el QR.`);
        setFiltroEstado("por_aprobar");
        abrirQr(id, { numero, trabajador, tokenAprobacion: token });
      } catch (err) {
        errVale.textContent = err.message;
        errVale.classList.remove("hidden");
      } finally {
        enviandoVale = false;
        btnEnviar.disabled = false;
        btnEnviar.textContent = "Crear vale y mostrar QR";
        actualizarBotonesFilas();
      }
    });
    // Al final a propósito: en modo demo el perfil llega de inmediato (sin
    // esperar a Firebase), y todo lo de arriba tiene que existir ya.
    requerirRol(Object.keys(ROLES), (p) => {
      if (perfil) return; // ya montado (no duplicar listeners)
      perfil = p;
      esBodega = p.rol === "bodega";
      const tipoVale = TIPOS_VALE[ROLES[p.rol].tipoVale];
      if (esBodega) {
        document.querySelector(".page-head h1").textContent = "Bandeja de entrada";
        document.title = "Bandeja de entrada | Inventario de Bodega";
      }
      // Solo bodega lleva subtítulo; quien pide ve directo el formulario.
      const tituloSub = document.getElementById("titulo-sub");
      tituloSub.textContent = esBodega
        ? "Vales que piden capataz, supervisor y prevencionista, ya aprobados por el trabajador que retira. Al marcarlo entregado se descuenta el stock y queda en el Historial."
        : "";
      tituloSub.classList.toggle("hidden", !esBodega);
      document.getElementById("nuevo-titulo").textContent = tipoVale ? `Nuevo vale de ${tipoVale.etiqueta}` : "";
      document.getElementById("bloque-nuevo").classList.toggle("hidden", esBodega);
      filtroTipo.classList.toggle("hidden", !esBodega);
      // Bodega parte en lo que tiene que entregar; quien pide, en lo que
      // falta que el trabajador apruebe.
      setFiltroEstado(esBodega ? "pendiente" : "por_aprobar");
      if (!esBodega) iniciarFormulario();

      escucharConObraActiva(
        escucharMateriales,
        (items) => { materiales = items; render(); refrescarStockFilas(); },
        (err) => flash(`Error al cargar el catálogo: ${err.message}`, "error"),
      );
      escucharConObraActiva(
        esBodega ? escucharValesObra : escucharMisVales(p.user.uid),
        (items) => { vales = items; render(); if (dlgQr.open) refrescarEstadoQr(); },
        (err) => { listaVales.innerHTML = `<p class="empty">Error al cargar: ${esc(err.message)}</p>`; },
      );
    });
  </script>
</body>
</html>
